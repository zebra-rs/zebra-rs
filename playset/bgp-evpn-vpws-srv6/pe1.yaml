# PE1 — EVPN VPWS provider edge over SRv6. IS-IS SRv6 distributes the
# locators; the vpws Type-1 carries an End.DX2 L2-Service SID carved from
# LOC1; `system ebpf enabled` spawns the cradle engine and tees the
# cross-connect into it (the kernel has no End.DX2 action).
system:
  hostname: pe1
  ebpf:
    enabled: true
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::1/128
- if-name: pe1-pe2
  ipv6:
    address: 2001:db8:0:12::1/64
  ebpf:
    enabled: true
- if-name: pe1-c1
  ebpf:
    enabled: true
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
    behavior: usid
router:
  isis:
    net: 49.0000.0000.0000.0001.00
    hostname: pe1
    is-type: level-2-only
    segment-routing:
      srv6:
        locator: LOC1
    interface:
    - if-name: lo
      ipv6:
        enabled: true
    - if-name: pe1-pe2
      network-type: point-to-point
      metric: 1
      ipv6:
        enabled: true
  bgp:
    global:
      as: 65001
      router-id: 10.0.0.1
    timer:
      adv-interval:
        ibgp: 1
    segment-routing:
      srv6:
        locator: LOC1
    afi-safi:
    - name: evpn
      encapsulation: srv6
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 102
        interface: pe1-c1
    neighbor:
    - remote-address: 2001:db8::2
      remote-as: 65001
      update-source: 2001:db8::1
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
