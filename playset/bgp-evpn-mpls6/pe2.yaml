# PE2 — mirror of pe1: v6 loopback 2001:db8:255::2 as `vtep-source`,
# transport label 101 toward pe1's loopback, EVI 100 on br100.
system:
  hostname: pe2
  ebpf:
    enabled: true
interface:
- if-name: lo
  ipv6:
    address: 2001:db8:255::2/128
- if-name: pe2-p
  ipv6:
    address: 2001:db8:23::2/64
  ebpf:
    enabled: true
- if-name: pe2-h2
  bridge: br100
  ebpf:
    enabled: true
bridge:
- name: br100
router:
  static:
    ipv6:
      route:
      - prefix: 2001:db8:255::1/128
        nexthop:
        - address: 2001:db8:23::1
          label: [101]
  bgp:
    global:
      as: 65000
      router-id: 2.2.2.2
    timer:
      adv-interval:
        ibgp: 1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      encapsulation: mpls
      vtep-source: 2001:db8:255::2
      evi:
      - id: 100
        bridge: br100
    neighbor:
    - remote-address: 2001:db8:255::1
      remote-as: 65000
      update-source: 2001:db8:255::2
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
