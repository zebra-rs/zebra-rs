# VTEP 3 — tenant VNI 20 only (h3). v6 loopback VTEP 2001:db8::3; it
# peers with vtep1 alone: its tenant is stretched to vtep1, never to
# vtep2.
system:
  hostname: vtep3
  ebpf:
    enabled: true
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::3/128
- if-name: vtep3-vtep1
  ipv6:
    address: 2001:db8:13::2/64
  ebpf:
    enabled: true
- if-name: vtep3-h3
  bridge: br20
  ebpf:
    enabled: true
bridge:
- name: br20
vxlan:
- name: vxlan20
  vni: 20
  local-address: 2001:db8::3
  bridge: br20
router:
  static:
    ipv6:
      route:
      - prefix: 2001:db8::1/128
        nexthop:
        - address: 2001:db8:13::1
  bgp:
    global:
      as: 65001
      router-id: 10.0.0.3
    afi-safi:
    - name: evpn
      advertise-all-vni: true
    neighbor:
    - remote-address: 2001:db8::1
      remote-as: 65001
      update-source: 2001:db8::3
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
