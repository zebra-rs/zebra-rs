# PE1 — EVPN over SRv6 (RFC 9252), all three services on one PE, every
# one of them forwarded by the cradle eBPF engine (`system ebpf enabled`).
# `encapsulation srv6` makes each route carry an SRv6 L2 Service SID
# carved from LOC1 in place of a VNI or a label; IS-IS SRv6 carries the
# locators through P.
#
# * E-LINE: `vpws eline1` cross-connects pe1-line1 to PE2 (EVI 300). The
#   Type-1 carries an End.DX2 SID.
# * E-LAN: br100 with pe1-lan1 — an End.DT2U SID on the Type-2 routes, an
#   End.DT2M SID on the Type-3. The vxlan100 device in br100 only
#   declares VNI 100; cradle forwards, never the kernel device.
# * E-TREE: br200 with pe1-root1 (VNI 200, declared by vxlan200). No
#   `etree` here: an AC that is not a leaf is a root, so this PE is the
#   tree's root site.
system:
  hostname: pe1
  ebpf:
    enabled: true
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::1/128
- if-name: pe1-p
  ipv6:
    address: 2001:db8:9:1::1/64
  ebpf:
    enabled: true
- if-name: pe1-line1
  ebpf:
    enabled: true
- if-name: pe1-lan1
  bridge: br100
  ebpf:
    enabled: true
- if-name: pe1-root1
  bridge: br200
  ebpf:
    enabled: true
bridge:
- name: br100
- name: br200
vxlan:
- name: vxlan100
  vni: 100
  local-address: 2001:db8::1
  bridge: br100
- name: vxlan200
  vni: 200
  local-address: 2001:db8::1
  bridge: br200
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
    behavior: usid
router:
  isis:
    net: 49.0000.0000.0000.0001.00
    hostname: pe1
    is-type: level-2-only
    segment-routing:
      srv6:
        locator: LOC1
    interface:
    - if-name: lo
      ipv6:
        enabled: true
    - if-name: pe1-p
      network-type: point-to-point
      metric: 10
      ipv6:
        enabled: true
  bgp:
    global:
      as: 65000
      router-id: 10.0.0.1
    timer:
      adv-interval:
        ibgp: 1
    segment-routing:
      srv6:
        locator: LOC1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      encapsulation: srv6
      vpws:
      - name: eline1
        evi: 300
        local-service-id: 1
        remote-service-id: 2
        interface: pe1-line1
    neighbor:
    - remote-address: 2001:db8::2
      remote-as: 65000
      update-source: 2001:db8::1
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
    - remote-address: 2001:db8::3
      remote-as: 65000
      update-source: 2001:db8::1
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
