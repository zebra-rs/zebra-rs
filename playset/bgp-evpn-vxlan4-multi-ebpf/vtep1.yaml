# VTEP 1 — serves BOTH tenants on the eBPF data plane: bridge domain 10
# (h1, stretched to vtep2) and bridge domain 20 (h4, stretched to
# vtep3). Where the kernel twin gives each VNI its own per-underlay VTEP
# address, the engine has ONE fabric-wide VTEP source — so both vxlan
# devices ride the same loopback (192.0.2.1), the BGP sessions ride it
# too, and static /32s toward the peers' loopbacks resolve the
# encapsulation via the teed FIB.
system:
  hostname: vtep1
  ebpf:
    enabled: true
interface:
- if-name: lo
  ipv4:
    address: 192.0.2.1/32
- if-name: vtep1-vtep2
  ipv4:
    address: 192.168.0.1/24
  ebpf:
    enabled: true
- if-name: vtep1-vtep3
  ipv4:
    address: 192.168.1.1/24
  ebpf:
    enabled: true
- if-name: vtep1-h1
  bridge: br10
  ebpf:
    enabled: true
- if-name: vtep1-h4
  bridge: br20
  ebpf:
    enabled: true
bridge:
- name: br10
- name: br20
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.0.2.1
  bridge: br10
- name: vxlan20
  vni: 20
  local-address: 192.0.2.1
  bridge: br20
router:
  static:
    ipv4:
      route:
      - prefix: 192.0.2.2/32
        nexthop:
        - address: 192.168.0.2
      - prefix: 192.0.2.3/32
        nexthop:
        - address: 192.168.1.2
  bgp:
    global:
      as: 65001
      router-id: 192.0.2.1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
    neighbor:
    - remote-address: 192.0.2.2
      remote-as: 65001
      update-source: 192.0.2.1
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
    - remote-address: 192.0.2.3
      remote-as: 65001
      update-source: 192.0.2.1
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
