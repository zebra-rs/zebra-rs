interface:
- if-name: lo
  ipv4:
    address: 10.0.0.10/32
- if-name: sy-sj
  ipv4:
    address: 192.168.3.2/24
- if-name: sy-sg
  ipv4:
    address: 192.168.16.2/24
system:
  hostname: sy
router:
  isis:
    net: 49.0000.0000.0000.0010.00
    hostname: sy
    is-type: level-2-only
    segment-routing:
      mpls: {}
    te-router-id: 10.0.0.10
    flex-algo:
    - algo: 128
      metric-type: min-unidir-link-delay
      dataplane:
        sr-mpls: true
    interface:
    - if-name: lo
      ipv4:
        enabled: true
        prefix-sid:
          index: 1000
        flex-algo-prefix-sid:
        - algo: 128
          index: 3000
    - if-name: sy-sj
      network-type: point-to-point
      ipv4:
        enabled: true
      metric: 10
      te-metric:
        measurement:
          enabled: true
          interval: 100
          damping-period: 5
    - if-name: sy-sg
      network-type: point-to-point
      ipv4:
        enabled: true
      metric: 10
      te-metric:
        measurement:
          enabled: true
          interval: 100
          damping-period: 5
