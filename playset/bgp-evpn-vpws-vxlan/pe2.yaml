# PE2 — the mirror of PE1. eline1 leaves the `vni` leaf unset, so its
# VNI defaults to the EVI (100): the two directions of the E-Line
# deliberately carry DIFFERENT VNIs — each PE encapsulates with what its
# peer advertised (the downstream-assigned Type-1 label-field semantic).
system:
  hostname: pe2
  ebpf:
    enabled: true
interface:
- if-name: lo
  ipv4:
    address: 192.0.2.2/32
- if-name: pe2-pe1
  ipv4:
    address: 10.0.12.2/24
  ebpf:
    enabled: true
- if-name: pe2-c2
  ebpf:
    enabled: true
router:
  static:
    ipv4:
      route:
      - prefix: 192.0.2.1/32
        nexthop:
        - address: 10.0.12.1
  bgp:
    global:
      as: 65001
      router-id: 192.0.2.2
    timer:
      adv-interval:
        ibgp: 1
    afi-safi:
    - name: evpn
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 102
        remote-service-id: 101
        interface: pe2-c2
    neighbor:
    - remote-address: 192.0.2.1
      remote-as: 65001
      update-source: 192.0.2.2
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
