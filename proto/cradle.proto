syntax = "proto3";

// cradle-rs data-plane control API.
//
// This is the seam between a routing control plane (ultimately zebra-rs's
// FibHandle backend) and the eBPF data plane. Interface references are by name;
// the server resolves them to ifindex and attaches the datapath to ports on
// demand.
package cradle.v1;

message Empty {}

message Port {
  string name = 1;  // interface name
  string mac = 2;   // empty => read from the interface
  bool l3 = 3;      // routed port; false => L2 bridge member in `vlan`
  uint32 vlan = 4;
  uint32 vrf_id = 5;  // VRF table for L3 ports (0 = global)
}

message L2Domain {
  uint32 vlan = 1;
  repeated string members = 2;  // interface names flooded within the domain
}

// An Ethernet Segment (EVPN multihoming, RFC 7432 §5): the local access
// port(s) of a multihomed CE. Replace semantics on `ports`; DF roles set with
// SetEsRole are re-rendered onto the new list. A port belongs to at most one
// segment.
message EthernetSegment {
  string esi = 1;             // 10-octet ESI, colon-hex — the segment's name
  repeated string ports = 2;  // local access port interface names
}

message EthernetSegmentDel {
  string esi = 1;
}

// This PE's Designated Forwarder role on an Ethernet Segment in one bridge
// domain (RFC 7432 §8.5). `df = false` withholds broadcast, multicast and
// unknown-unicast from the segment's ports in that domain (the non-DF
// filter); known unicast is unaffected (all-active). No role = forward.
message EsRole {
  string esi = 1;
  uint32 bd = 2;
  bool df = 3;
  // Single-active redundancy (RFC 7432 §14.1.1): a non-DF port is a standby
  // that passes nothing in either direction — known unicast toward the CE
  // and anything the CE sends — not only BUM. Ignored when `df` is set.
  bool single_active = 4;
}

// The other PEs attached to Ethernet Segment `esi` — their VTEP / overlay
// source addresses, as learned from the Type-4 ES routes. Replace
// semantics. BUM that arrives from one of them is never sent back onto the
// segment's local ports (split horizon / local bias, RFC 8365 §8.3.1): that
// PE already delivered it to the CE, or the CE sent it.
message EsPeers {
  string esi = 1;
  repeated string vteps = 2;  // IPv4 or IPv6
}

// One PE a MAC behind an Ethernet Segment can be sent to — the same
// (SRv6 SID | VTEP | PE+label) triple a replication slot names: exactly one
// of remote_sid / remote_vtep / remote_pe. A VXLAN member tunnels with the
// bridge domain's VNI (SetVni binding).
message EsNhgMember {
  string remote_sid   = 1;  // SRv6: the PE's End.DT2U SID for this bridge domain
  string remote_vtep  = 2;  // VXLAN: the PE's VTEP (IPv4 or IPv6)
  string remote_pe    = 3;  // MPLS: the PE's address
  uint32 remote_label = 4;  // MPLS: the PE's EVI service label for this domain
}

// The Ethernet Segment nexthop group for one bridge domain (RFC 7432 §8.4
// aliasing): every PE currently attached to `esi` in `bd` — those with a
// live per-ES A-D route and a per-EVI A-D for this EVI. Replace semantics;
// an empty member list removes the group. FDB entries pointing at the
// segment (FdbRemote.esi) pick a member per flow, and one update here
// re-points all of them (§8.2 mass withdraw).
message EsNhg {
  string esi = 1;
  uint32 bd = 2;
  repeated EsNhgMember members = 3;
}

message PortDel {
  string name = 1;  // interface name (matched against the attach-time name
                    // when the device is already gone)
}

message FdbFlush {
  // Both filters optional and ANDed; no filter = every learned entry.
  string port = 1;  // only entries learned on this port (empty = any)
  uint32 vlan = 2;  // only entries in this bridge domain (0 = any)
}

message Nexthop {
  uint32 id = 1;
  string gateway = 2;     // empty => on-link / connected
  string oif = 3;         // output interface name (used when oif_index == 0)
  uint32 oif_index = 4;   // output ifindex; preferred when non-zero
  bool v6 = 5;            // IPv6 nexthop (gateway parsed as IPv6)
  repeated uint32 labels = 6;  // MPLS out-label stack, [0] = outermost
  repeated string segs = 7;    // SRv6 SID list, forwarding order ([0] = outer DA)
  uint32 encap_mode = 8;       // 0 = H.Encaps(.Red), 2 = H.Insert (TI-LFA repair)
  // Fast-reroute: the nexthop to switch to when this one's link goes down —
  // typically the TI-LFA repair (segs + encap_mode 2). 0 = unprotected.
  uint32 backup_id = 12;
  // GTP-U encap (GTP4.E): a non-empty gtp_dst makes this a GTP nexthop that
  // wraps the packet in outer IPv4 + UDP(2152) + GTP-U(gtp_teid) over the v4
  // underlay gateway/oif. Mutually exclusive with segs/labels.
  string gtp_src = 13;   // outer IPv4 source (local N3/N9 tunnel address)
  string gtp_dst = 14;   // outer IPv4 destination (peer gNB / UPF address)
  uint32 gtp_teid = 15;  // GTP-U TEID
  // EVPN symmetric-IRB VXLAN L3 encap: a non-empty vxlan_vtep makes this an
  // NH_F_VXLAN nexthop that VXLAN-wraps the routed packet with vxlan_l3vni
  // toward vxlan_vtep (inner dst MAC = vxlan_rmac, the remote PE's router
  // MAC), over the v4 underlay gateway/oif. Mutually exclusive with segs/etc.
  string vxlan_vtep = 16;
  uint32 vxlan_l3vni = 17;
  string vxlan_rmac = 18;
  // MPLS TTL propagation at imposition (RFC 3443). false (default) = uniform:
  // seed the outer label TTL from the inner IP TTL. true = pipe: seed a fixed
  // 255, hiding the LSP hop count. Only meaningful with labels. Field number
  // must match cradle-rs's proto/cradle.proto.
  bool mpls_pipe_ttl = 19;
}

// A nexthop group for ECMP: ordered member nexthop ids. A route whose flags
// include FIB_F_ECMP and whose nexthop_id is this group's id load-balances over
// the members.
message NexthopGroup {
  uint32 id = 1;
  repeated uint32 members = 2;
}

message Route4 {
  string prefix = 1;   // "a.b.c.d/len"
  uint32 nexthop_id = 2;
  uint32 flags = 3;
  uint32 vrf_table_id = 4;  // 0 = global (mirrors Ilm.vrf_table_id)
}

message Route4Del {
  string prefix = 1;
  uint32 vrf_table_id = 2;
}

// Bulk route install — the initial-load path. In dir24 mode each affected
// /24 block is recomputed once per batch instead of once per route.
message Route4Batch {
  repeated Route4 routes = 1;
}

message FibSummaryRequest {}

// IPv4 FIB engine state (`cradle ctl fib`).
message FibSummary {
  string fib4_mode = 1;  // "lpm" | "dir24"
  uint64 routes4 = 2;    // dir24 shadow route count (0 in lpm mode)
  uint32 tbl8_used = 3;
  uint32 tbl8_free = 4;
}

message Route6 {
  string prefix = 1;   // "addr/len"
  uint32 nexthop_id = 2;
  uint32 flags = 3;
  uint32 vrf_table_id = 4;  // 0 = global (feeds FIB6_VRF)
}

message Route6Del {
  string prefix = 1;
  uint32 vrf_table_id = 2;
}

// An SRv6 local SID (seg6local) — mirrors zebra's route_sid_install. Phase 1
// implements the End.DT4/DT6/DT46 behaviors; other fields are carried so
// later phases (End.X, uN/uA, End.B6) need no ABI break.
message LocalSid {
  string sid          = 1;   // SID address (or locator prefix for uSID)
  uint32 prefix_len   = 2;   // /128 for End/End.X/End.DT*; masked for uSID
  uint32 behavior     = 3;   // SRV6_BH_* value
  uint32 vrf_table_id = 4;   // End.DT* table (0 = global)
  uint32 oif          = 5;   // seg6 device (End/uN) or egress link (End.X)
  string nh6          = 6;   // adjacency IPv6 for End.X / uA
  // SID structure. uN/uA shift by ln (block=lb); REPLACE-C-SID rewrites a
  // C-SID of ln+fun bits after a block of lb bits (RFC 9800).
  uint32 lb_bits = 7; uint32 ln_bits = 8; uint32 fun_bits = 9; uint32 arg_bits = 10;
  uint32 nexthop_id = 11;    // cross-connect adjacency for End.X (into NEXTHOPS)
  uint32 flavors    = 12;    // SRV6_FLAVOR_* bitmask (PSP=1, USP=2, USD=4)
}

message LocalSidDel {
  string sid = 1;
  uint32 prefix_len = 2;
}

message Srv6EncapSource { string addr = 1; }  // outer IPv6 SA for H.Encaps

// EVPN/VXLAN L2VNI: bind VNI `vni` to bridge domain `vlan` (both datapath
// directions — encap picks the VNI by bridge domain, decap picks the bridge
// domain by VNI).
message Vni {
  uint32 vni  = 1;
  uint32 vlan = 2;   // L2VNI bridge domain
  // EVPN symmetric IRB (RFC 9135): an L3VNI binds the VNI to a VRF instead of
  // a bridge domain — a received frame routes its inner IP in `vrf`, with this
  // PE's router MAC `rmac`.
  bool   l3   = 3;
  uint32 vrf  = 4;
  string rmac = 5;
}

message VniDel { uint32 vni = 1; }

// Local VTEP source IPv4 — the VXLAN outer source address, and the decap
// match for received VXLAN traffic.
message VtepSource { string addr = 1; }

// EVPN-over-SRv6 overlay FDB entry: MAC `mac` in bridge domain `bd` sits
// behind the remote PE's End.DT2U/DT2M service SID. `nexthop_id` selects the
// underlay adjacency; 0 = resolve by a FIB6 lookup on `remote_sid` in the
// datapath (the control plane doesn't need to pre-resolve). The all-ones MAC
// is the per-BD BUM sentinel (remote End.DT2M).
message FdbRemote {
  string mac         = 1;
  uint32 bd          = 2;
  string remote_sid  = 3;   // SRv6: remote End.DT2U/DT2M service SID
  uint32 nexthop_id  = 4;   // 0 = FIB lookup on the SID/VTEP/PE in the datapath
  string remote_vtep = 5;   // VXLAN: remote VTEP IPv4
  string remote_pe    = 6;  // MPLS: remote PE address (exactly one of sid/vtep/pe)
  uint32 remote_label = 7;  // MPLS: that PE's EVI service label
  // EVPN multihoming aliasing: when set, the MAC sits behind this Ethernet
  // Segment and is reached through the segment's nexthop group for `bd`
  // (SetEsNhg) instead of a single remote — the remote_* fields are ignored.
  string esi = 8;
}

message FdbRemoteDel {
  string mac = 1;
  uint32 bd  = 2;
}

// A control-plane LOCAL FDB entry: `mac` in `bd` is reached over local
// `port`, like a learned entry, but it is neither aged nor reported by
// WatchFdb. EVPN multihoming: a MAC a peer PE advertised on a segment this
// node is also attached to (RFC 7432 §8.4). Removed with DelFdbRemote.
message FdbLocal {
  string mac = 1;
  uint32 bd = 2;
  string port = 3;  // interface name
}

// A VPWS cross-connect (EVPN E-Line, RFC 8214): bind the attachment
// circuit `port` to the remote End.DX2/DX2V service SID — every frame
// arriving on the AC is MAC-in-SRv6 encapsulated toward it (no FDB).
message Xconnect {
  string port      = 1;  // AC interface name (or use port_index)
  uint32 port_index = 2; // AC ifindex (0 = resolve `port` by name)
  string remote_sid = 3;
  // When non-empty, also install this End.DX2 LocalSid bound to the same
  // AC (decap + raw emit) — one RPC binds the E-Line both directions.
  // With a non-zero vid the LocalSid is an End.DX2V over dx2v_table.
  string local_sid  = 4;
  // Non-zero = VLAN-scoped E-Line (RFC 8214 VLAN-based service): only
  // 802.1Q frames with this VID on the AC enter the cross-connect (the
  // tag rides inside the encapsulation), and the return direction —
  // local_sid's End.DX2V, or local_vni's E-Line VNI — demuxes on the
  // inner VID from its (dx2v_table, vid) entry onto the AC.
  uint32 vid        = 5;
  uint32 dx2v_table = 6; // VLAN-table id (only with vid != 0)
  string remote_vtep = 7; // VXLAN: remote VTEP IPv4
  uint32 remote_vni  = 8; // VXLAN: VNI the remote advertised (with remote_vtep)
  // When non-zero, also bind this VNI as the E-Line's local decap
  // identity (the VNI our own Type-1 advertised) — the VXLAN analog of
  // local_sid, at most one of local_sid / local_vni / local_label.
  uint32 local_vni   = 9;
  string remote_pe    = 10; // MPLS: remote PE (IPv4 or IPv6)
  uint32 remote_label = 11; // MPLS: service label the remote advertised (with remote_pe)
  // When non-zero, also install this label as the E-Line's local decap
  // identity (the label our own Type-1 advertised): an ILM entry pops it
  // and emits the inner frame raw on the AC — the MPLS analog of
  // local_sid, at most one of the three.
  uint32 local_label  = 12;
}

message XconnectDel {
  string port       = 1;
  uint32 port_index = 2;
  string local_sid  = 3; // when non-empty, also remove this End.DX2/DX2V LocalSid
  uint32 vid        = 4; // non-zero = remove the VLAN-scoped binding
  uint32 dx2v_table = 5;
  uint32 local_vni  = 6; // when non-zero, also remove this E-Line VNI binding
  uint32 local_label = 7; // when non-zero, also remove this E-Line pop ILM
}

// A BUM ingress-replication slot: one remote PE in bridge domain `bd`,
// reached by MAC-in-SRv6 toward its End.DT2M `remote_sid`. cradle manages
// the slot's plumbing itself (a veth pair in the flood list whose far end
// per-copy encapsulates — see docs/design/evpn-srv6.md). Idempotent per
// (bd, remote_sid). The EVPN Type-3 tee drives these; a bridge domain using
// slots must not also program the all-ones-MAC sentinel.
message ReplSlot {
  uint32 bd          = 1;
  string remote_sid  = 2;   // SRv6: remote End.DT2M SID
  string remote_vtep = 3;   // VXLAN: remote VTEP IPv4 (VNI from the bd's SetVni)
  string remote_pe    = 4;  // MPLS: remote PE address
  uint32 remote_label = 5;  // MPLS: that PE's BUM (EVI) service label
}

// An RFC 9524 Replication segment: the local End.Replicate SID `sid` is an SR
// P2MP tree node that fans a received copy out to each downstream branch. A
// Head/Transit node lists remote branches (each a downstream Replication-SID);
// a Bud additionally lists a `local` branch (cradle creates a leaf veth so the
// copy is End.DT2M-decapped into the bridge domain). SetReplSeg replaces the
// whole segment. Field numbers must match cradle-rs's proto/cradle.proto.
message ReplSeg {
  string sid = 1;                       // local End.Replicate SID (map key)
  repeated ReplSegBranch branches = 2;
  uint32 hop_limit_threshold = 3;       // RFC 9524 (0 = disabled)
}
message ReplSegBranch {
  string sid        = 1; // downstream Replication-SID (own End.DT2M SID when local)
  uint32 nexthop_id = 2; // remote branch: explicit underlay nexthop, 0 = FIB6-on-sid
  bool   local      = 3; // Bud local delivery — cradle creates the leaf veth
}
message ReplSegDel { string sid = 1; }

// An egress-protection mirror route (End.M context): traffic exposed by an
// End.M decap whose destination falls in `prefix` (the FAILED egress PE's
// SID space) is served locally with DT-style semantics — decap once more
// and look the inner packet up in `vrf_table_id`. `ctx` scopes the entry to
// the End.M SID's context id.
message MirrorRoute {
  uint32 ctx          = 1;
  string prefix       = 2;  // the protected locator, e.g. fcbb:bbbb:3::/48
  uint32 prefix_len   = 3;
  uint32 behavior     = 4;  // SRV6_BH_END_DT4/DT6/DT46
  uint32 vrf_table_id = 5;
}

message MirrorRouteDel {
  uint32 ctx        = 1;
  string prefix     = 2;
  uint32 prefix_len = 3;
}

// Subscribe to datapath MAC learning (EVPN over SRv6): cradle streams every
// locally-learned (mac, bridge-domain) so the control plane can originate
// EVPN Type-2 routes for it. Only local entries are reported (never
// FDB_F_REMOTE overlay entries or the BUM sentinel). Learns only — cradle
// has no FDB aging yet; entries persist for the datapath's lifetime. On
// (re)subscribe the full current set is replayed first.
message WatchFdbRequest {}

message FdbEvent {
  string mac = 1;
  uint32 bd  = 2;
  // 0 = learned; 1 = aged out (the entry was removed after `fdb_age_secs`
  // idle — the control plane should withdraw its Type-2).
  uint32 event = 3;
  // Ifindex of the port the MAC was learned on, so the MAC can be placed on
  // an Ethernet Segment (RFC 7432 §7.1) instead of being advertised
  // single-homed. Set on learn events only; 0 means "unknown" and must be
  // treated as single-homed rather than as a port — that is also what an
  // older cradle, which never sets this, leaves behind. Field number must
  // match cradle-rs's proto/cradle.proto.
  uint32 port = 4;
}

// --- BFD Echo / detection offload ---
// Arm the Echo *originator* + return detector for a single-hop session: cradle
// transmits a self-addressed Echo (udp/3785) toward `peer` every `tx_us`
// (jittered) and times the returns in-kernel (bpf_timer); if returns stop for
// tx_us*detect_mult it streams an echo-down WatchBfd event. `discr` is our local
// BFD discriminator (the map key); `local`/`peer` are the session address pair
// (same family). Re-arming with changed timing updates it.
message BfdEcho {
  uint32 discr       = 1;
  string local       = 2;
  string peer        = 3;
  uint32 tx_us       = 4;
  uint32 detect_mult = 5;
  // Egress interface for the transmitted Echo. cradle is multi-port (unlike the
  // per-interface standalone helper), so the originator needs to be told which
  // NIC the single-hop peer is on.
  string oif         = 6;
}

// Arm the control-packet expiration watchdog (RFC 5880 §6.8.4) for an Up
// session: cradle's XDP observes inbound BFD control (udp/3784, GTSM TTL 255)
// keyed by Your Discriminator and re-arms a bpf_timer; if control stops for
// `detect_us` it streams a detect-down event. Originates nothing.
message BfdDetect {
  uint32 discr     = 1;
  uint32 detect_us = 2;
}

message BfdKey { uint32 discr = 1; }

message WatchBfdRequest {}

message BfdEvent {
  uint32 discr = 1;
  // 0 = echo-down (our originated Echo stopped returning); 1 = detect-down (the
  // peer's control packets stopped). The daemon drives the session Down.
  uint32 kind  = 2;
}

message Neighbor4 {
  string oif = 1;       // interface name (used when oif_index == 0)
  string ip = 2;
  string mac = 3;
  uint32 oif_index = 4; // ifindex; preferred when non-zero
}

message Neighbor6 {
  string oif = 1;       // interface name (used when oif_index == 0)
  string ip = 2;
  string mac = 3;
  uint32 oif_index = 4; // ifindex; preferred when non-zero
}

// An incoming-label map (ILM) entry — mirrors zebra-rs's FibHandle
// ilm_add/ilm_replace/ilm_del. `action` is MPLS_OP_*: 0 = swap (the nexthop's
// labels are the out stack), 1 = pop-to-IP (PHP / L3VPN egress),
// 2 = pop one label.
message Ilm {
  uint32 in_label = 1;      // 20-bit incoming label (the LFIB key)
  uint32 nexthop_id = 2;    // resolved nexthop; its labels are the swap stack
  uint32 action = 3;        // MPLS_OP_SWAP | POP_L3 | POP
  uint32 vrf_table_id = 4;  // for POP_L3 into a VRF (0 = global)
  // MPLS TTL propagation at disposition (RFC 3443). false (default) = pipe:
  // discard the label TTL, preserve the inner IP TTL. true = uniform: when this
  // ILM pops the last label to IP, copy the popped label TTL into the inner IP
  // header. Field number must match cradle-rs's proto/cradle.proto.
  bool ttl_uniform = 5;
}

message IlmDel {
  uint32 in_label = 1;
}

message Backend {
  string ip = 1;
  uint32 port = 2;
}

message Service {
  uint32 svc_id = 1;
  string vip = 2;
  uint32 port = 3;
  string proto = 4;  // tcp | udp
  repeated Backend backends = 5;
}

message StatsRequest {}

// One datapath counter: a packet count at a forwarding decision point.
message StatEntry {
  string name = 1;
  uint64 packets = 2;
}

message StatsReply {
  repeated StatEntry entries = 1;
}

// An L7 (HTTP) path-prefix route to a backend.
message L7Route {
  string path_prefix = 1;  // longest-prefix match on the request path
  string backend_ip = 2;
  uint32 backend_port = 3;
}

// An L7 service: TCP flows to vip:port are steered to the transparent proxy,
// which routes by HTTP path to one of `routes`.
message L7Service {
  string vip = 1;
  uint32 port = 2;
  repeated L7Route routes = 3;
}

// A GTP-U decap PDR (H.M.GTP4.D): a G-PDU arriving on (dst, teid) in
// match_vrf is stripped and its inner packet forwarded in vrf (0 = global).
// Mirrors the cradle server.
message GtpPdr {
  string dst = 1;        // local outer IPv4 destination the G-PDU arrives on
  uint32 teid = 2;       // GTP-U TEID
  uint32 vrf = 3;        // inner VRF table id (0 = global)
  uint32 match_vrf = 4;  // match context: ingress port's VRF (0 = global)
}
message GtpPdrDel {
  string dst = 1;
  uint32 teid = 2;
  uint32 match_vrf = 3;  // match context the PDR was installed for
}

// ---- Forwarding-table dump (`show ebpf <table>` / `cradle dump`) ----
// Mirrors the cradle server's definitions verbatim.

// Which datapath table to dump.
enum DumpTable {
  DUMP_L2 = 0;      // FDB (L2 bridge MAC table)
  DUMP_IPV4 = 1;    // IPv4 FIB (LPM or DIR-24-8)
  DUMP_IPV6 = 2;    // IPv6 FIB
  DUMP_MPLS = 3;    // MPLS ILM (incoming-label map)
  DUMP_SRV6 = 4;    // SRv6 local SIDs (My-SID) + transit encaps
  DUMP_NEXTHOP = 5; // NEXTHOPS + ECMP group membership
}

message DumpRequest {
  DumpTable table = 1;
  // Per-VRF FIB filter for IPv4/IPv6 (0 = global table). Ignored otherwise.
  uint32 vrf = 2;
  // Resolve nexthop_id -> gateway/oif/labels (fills NexthopInfo).
  bool resolve = 3;
}

// Resolved nexthop detail; only populated when DumpRequest.resolve is set and
// the id names a single nexthop (empty for ECMP group ids).
message NexthopInfo {
  uint32 id = 1;
  string gateway = 2; // gateway IP ("" = on-link / unresolved)
  uint32 oif = 3;
  repeated uint32 labels = 4; // MPLS out-label stack, [0] = outermost
  uint32 flags = 5;           // NH_F_*
}

message FdbDumpEntry {
  string mac = 1;
  uint32 vlan = 2;
  uint32 oif = 3;        // local egress ifindex, or underlay nh id if remote
  uint32 flags = 4;      // FDB_F_*
  string remote_sid = 5; // End.DT2U SID for remote entries ("" otherwise)
  uint64 age_ms = 6;     // ms since last local learn (0 = control-plane/never)
}

message FibDumpEntry {
  string prefix = 1; // e.g. "10.0.0.0/24"
  uint32 vrf = 2;
  uint32 nexthop_id = 3;
  uint32 flags = 4;   // FIB_F_*
  NexthopInfo nh = 5; // populated iff resolve
}

message MplsDumpEntry {
  uint32 label = 1;
  string op = 2; // "swap" | "pop_l3" | "pop"
  uint32 nexthop_id = 3;
  uint32 vrf = 4; // POP_L3 disposition table
  NexthopInfo nh = 5;
}

message Srv6LocalSidEntry {
  string sid = 1; // e.g. "fc00:0:1::"
  uint32 prefix_len = 2;
  string behavior = 3; // "End", "End.DT4", "uN", ...
  uint32 flavors = 4;  // SRV6_FLAVOR_* bitmask
  uint32 vrf = 5;
  uint32 nexthop_id = 6;
  NexthopInfo nh = 7;
}

message Srv6EncapEntry {
  uint32 nexthop_id = 1; // key into SRV6_ENCAP (the imposing nexthop)
  string mode = 2;       // "encaps" | "insert"
  repeated string segs = 3; // segment list, [0] = outer destination
}

// One NEXTHOPS entry, or — when `group` is non-empty — one ECMP group
// (`NHGROUP`/`NHGROUP_MEMBER`): the group's member nexthop ids, with the
// per-nexthop fields zeroed.
message NexthopDumpEntry {
  uint32 id = 1;
  string gateway = 2;         // "" = on-link / unresolved
  uint32 oif = 3;
  uint32 flags = 4;           // NH_F_*
  repeated uint32 labels = 5; // MPLS out-label stack, [0] = outermost
  uint32 backup_id = 6;       // fast-reroute backup nexthop (0 = unprotected)
  repeated uint32 group = 7;  // ECMP member ids (group rows only)
}

message DumpEntry {
  oneof entry {
    FdbDumpEntry fdb = 1;
    FibDumpEntry fib = 2;
    MplsDumpEntry mpls = 3;
    Srv6LocalSidEntry srv6_localsid = 4;
    Srv6EncapEntry srv6_encap = 5;
    NexthopDumpEntry nexthop = 6;
  }
}

service Cradle {
  rpc SetPort(Port) returns (Empty);
  // Inverse of SetPort: detach the datapath programs, drop the PORTS entry
  // and the port's derived routes, and flush the MACs learned on it. The
  // caller updates any L2 domain membership itself (SetL2Domain replaces
  // the full member list).
  rpc DelPort(PortDel) returns (Empty);
  rpc SetL2Domain(L2Domain) returns (Empty);
  // EVPN multihoming: define an Ethernet Segment's local ports, drop it, and
  // set this PE's per-bridge-domain DF role (the non-DF BUM filter).
  rpc SetEthernetSegment(EthernetSegment) returns (Empty);
  rpc DelEthernetSegment(EthernetSegmentDel) returns (Empty);
  rpc SetEsRole(EsRole) returns (Empty);
  rpc SetEsPeers(EsPeers) returns (Empty);
  rpc SetEsNhg(EsNhg) returns (Empty);
  rpc AddFdbLocal(FdbLocal) returns (Empty);
  // Flush locally-learned FDB entries (never control-plane-installed remote
  // entries). WatchFdb subscribers observe the removals as age events.
  rpc FlushFdb(FdbFlush) returns (Empty);
  rpc SetNexthop(Nexthop) returns (Empty);
  rpc SetNexthopGroup(NexthopGroup) returns (Empty);
  rpc AddRoute4(Route4) returns (Empty);
  rpc AddRoute4Batch(Route4Batch) returns (Empty);
  rpc DelRoute4(Route4Del) returns (Empty);
  rpc GetFibSummary(FibSummaryRequest) returns (FibSummary);
  rpc AddRoute6(Route6) returns (Empty);
  rpc DelRoute6(Route6Del) returns (Empty);
  rpc SetNeighbor4(Neighbor4) returns (Empty);
  rpc SetNeighbor6(Neighbor6) returns (Empty);
  rpc AddIlm(Ilm) returns (Empty);
  rpc DelIlm(IlmDel) returns (Empty);
  rpc AddLocalSid(LocalSid) returns (Empty);
  rpc DelLocalSid(LocalSidDel) returns (Empty);
  rpc AddGtpPdr(GtpPdr) returns (Empty);
  rpc DelGtpPdr(GtpPdrDel) returns (Empty);
  rpc SetSrv6EncapSource(Srv6EncapSource) returns (Empty);
  rpc SetVni(Vni) returns (Empty);
  rpc DelVni(VniDel) returns (Empty);
  rpc SetVtepSource(VtepSource) returns (Empty);
  rpc AddFdbRemote(FdbRemote) returns (Empty);
  rpc DelFdbRemote(FdbRemoteDel) returns (Empty);
  rpc WatchFdb(WatchFdbRequest) returns (stream FdbEvent);
  // BFD Echo / detection offload. Arm/disarm are keyed by our local
  // discriminator; WatchBfd streams echo-down / detect-down.
  rpc ArmBfdEcho(BfdEcho) returns (Empty);
  rpc DisarmBfdEcho(BfdKey) returns (Empty);
  rpc ArmBfdDetect(BfdDetect) returns (Empty);
  rpc DisarmBfdDetect(BfdKey) returns (Empty);
  rpc WatchBfd(WatchBfdRequest) returns (stream BfdEvent);
  rpc AddXconnect(Xconnect) returns (Empty);
  rpc DelXconnect(XconnectDel) returns (Empty);
  rpc AddReplSlot(ReplSlot) returns (Empty);
  rpc DelReplSlot(ReplSlot) returns (Empty);
  rpc SetReplSeg(ReplSeg) returns (Empty);
  rpc DelReplSeg(ReplSegDel) returns (Empty);
  rpc AddMirrorRoute(MirrorRoute) returns (Empty);
  rpc DelMirrorRoute(MirrorRouteDel) returns (Empty);
  rpc AddService(Service) returns (Empty);
  rpc GetStats(StatsRequest) returns (StatsReply);
  rpc Dump(DumpRequest) returns (stream DumpEntry);
  rpc AddL7Service(L7Service) returns (Empty);
}
