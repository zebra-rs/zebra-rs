# CHANGELOG.yaml – the single source of truth for the project changelog.
# Two consumers render from this one file, so there is no second place to edit:
#   * packaging/changelog-gen.sh -> the Debian-format changelog cargo-deb ships
#     (see zebra-rs/Cargo.toml [package.metadata.deb] changelog)
#   * packaging/release-notes.sh -> the GitHub release body (nightly.yaml uses
#     the top entry; release.yaml uses the entry matching the v<X.Y.Z> tag)
# The note bodies below are written in Markdown (### headings, * bullets) so
# they render directly on the GitHub Releases page.
# Keep newest entry first.
# All timestamps must be in full ISO-8601 format.
# Fields "distribution" and "urgency" are optional per-entry; if you omit them,
# changelog-gen.sh defaults to distribution "unstable" and urgency "medium".

- semver: 26.8.6
  date: 2026-08-29T18:00:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### EVPN multihoming over SRv6 and MPLS
        * Multihoming is no longer VXLAN-only in practice: the same
          DF election, non-DF filter, aliasing / mass withdraw and
          single-active now hold over SRv6 and MPLS, each proven by a
          static and a BGP-driven cradle-rs BDD feature
        * SRv6 split horizon was broken end to end: cradle stamped the
          first local SID as the outer source of its MAC-in-SRv6
          packets while the segment peers were told the Type-4
          Originating IP, so a peer's copies of the CE's own BUM came
          back onto the segment. An IPv6 `vtep-source` — the VNI
          declaration's `local-address`, the PE's EVPN source — is
          now also the SRv6 outer source, whichever arrives first, and
          the rule is documented: `vtep-source` must be that address
        * MPLS split horizon by ESI label (RFC 7432 §8.3): under
          `encapsulation mpls` every Ethernet Segment draws an ESI
          label from the dynamic label block, advertises it in the
          per-ES A-D's ESI Label EC and tees it to cradle for decap;
          from each peer's A-D and Type-3 the tee builds an ESI-label
          replication slot toward the peer, so the label is pushed
          only toward the segment's own peers and only for BUM that
          entered through the segment. `show bgp evpn
          ethernet-segment` prints the label
        * Two tee gaps closed on the way: a segment port under an EVI
          declared by bridge name (`evi <id> bridge <name>`, the MPLS
          shape) had no EVI set at all — no DF role was ever teed
          under MPLS — and a segment configured before `system cradle`
          took effect had its segment tee dropped for good; the RIB
          now announces the tee coming up and BGP re-syncs
    - note: |
        ### BGP: IPv6-unnumbered peers and BFD
        * A BFD Down on an `interface-neighbor` (IPv6 link-local,
          unnumbered) peer was dropped as "unknown peer" — the session
          stayed Established with its routes in the FIB, a blackhole
          under ECMP. BFD state changes now resolve interface-keyed
          peers too, guarded by the recorded session key so a stale
          Down for a re-keyed session cannot stop the wrong peer; the
          teardown logs `BFD down` as the reset reason and recovers
          once BFD packets flow again (#2343)
    - note: |
        ### Documentation
        * `docs/design/bgp-evpn-mh-frr-interop-lab.md`: the interop
          lab plan for validating the multihoming arc against FRR on
          a shared Ethernet Segment — topology, five ordered phases
          with pass criteria (remote-only, mixed-segment DF
          agreement, BUM filters both ways, aliasing / mass withdraw,
          the known divergences, LACP MC-LAG), method and deliverables
        * The EVPN over SRv6 and over MPLS book chapters now state the
          multihoming status for their encapsulation; the design docs
          and dataplane matrix follow
    - note: |
        ### Housekeeping
        * The pinned cradle-rs engine release is v1.1.1 (bond
          membership tracked live — enslave, release or replace a LAG
          member without re-applying the port; the SRv6 and MPLS
          multihoming features; the ESI-label datapath; `cradle dump
          l2` shows the segment / MPLS / static FDB flags); the
          package recommends `cradle-rs (>= 1.1.1)`
- semver: 26.8.5
  date: 2026-08-28T18:00:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### EVPN multihoming on the cradle-rs dataplane
        * EVPN multihoming is now implemented end to end, and it is
          cradle-only by decision: the kernel VXLAN backend stays
          single-homed, and every multihoming verdict BGP reaches is
          teed over gRPC to the cradle-rs eBPF dataplane, which has
          the source VTEP, the bridge domain and the FDB verdict in
          hand where the kernel bridge model loses them
          (`docs/design/bgp-evpn-multihoming-dataplane.md` records
          the analysis of the ENOG91 FRR EVPN-MH talk that motivated
          it)
        * Designated-Forwarder election results are pushed per
          (segment, bridge domain) as the non-DF BUM filter; the
          segment's peer VTEPs are pushed as the RFC 8365 §8.3.1
          split-horizon list, so BUM never loops back to the segment
          it came from
        * Aliasing and mass withdraw (RFC 7432 §8.4/§8.2): every
          (segment, EVI) with live per-ES and per-EVI A-D routes
          becomes an Ethernet Segment nexthop group; MACs behind the
          segment resolve through it per flow, a peer's MAC on our
          own segment installs as a local entry on our port, and one
          group update re-points every MAC when a PE leaves
        * The segment port may be a kernel bond (LAG toward the CE),
          and `redundancy-mode single-active` now blocks the standby
          port both ways; single-active segments keep a backup path
          — the group is teed DF-first and cradle forwards to the
          primary alone, so the DF's per-ES A-D withdrawal fails
          every MAC over before its stale MAC routes are gone
        * The pinned cradle-rs engine release is v1.1.0, which
          carries the matching dataplane; the APT pipeline ingests
          it and the package recommends `cradle-rs (>= 1.1.0)`
    - note: |
        ### EVPN DF election: HRW, AC-DF and access link state
        * `df-election algorithm hrw` elects by RFC 8584 §3 Highest
          Random Weight (Alg 1), bit-exact with the RFC formula so a
          segment shared with other vendors agrees on the DF; a
          `preference` still overrides it and a mixed segment falls
          back to service carving as before
        * The `ac-df` capability is now honoured, not only advertised:
          once every PE on a segment sets it, each EVI's election
          counts only the PEs whose per-EVI A-D for it is present
          (RFC 8584 §4), so a PE whose attachment circuit for one
          service went down drops out of that election alone
        * BGP tracks the operational state of access links: a VPWS
          service whose AC goes down withdraws its Type-1, and an
          Ethernet Segment whose port goes down — including a bond
          that loses carrier while staying UP, given a link monitor
          such as `miimon` — withholds its ES routes exactly as the
          startup delay does, restoring them on link up
        * `show bgp evpn ethernet-segment` reports the negotiated
          algorithm, AC-DF status, a withheld port, and the nexthop
          groups teed to the datapath (primary and backup for
          single-active), on a remote PE with no segment of its own
          as well
    - note: |
        ### BGP Roles and Only-to-Customer (RFC 9234)
        * `neighbor X otc-local-role customer|provider|peer|
          route-server|route-server-client [strict]` — the Cisco IOS
          XR spelling — negotiates the BGP Role capability at OPEN,
          rejects a mismatched pair with the Role Mismatch
          NOTIFICATION, and in strict mode refuses a peer that sends
          no role at all; inheritable from a neighbor-group and
          available on VRF neighbors
        * The OTC path attribute drives route-leak prevention on IPv4
          and IPv6 unicast: leaked routes from a customer, or from a
          peer carrying another AS's OTC, are dropped on ingress and
          counted; routes from a provider or peer are stamped with
          OTC; and on egress OTC is added toward customers and peers
          and routes already carrying it are never sent up to a
          provider, with `show bgp neighbor` and the book's new
          chapter explaining every rule
    - note: |
        ### BGP route-server mode (RFC 7947)
        * `neighbor X route-server-client` makes zebra-rs an Internet
          Exchange route server toward that peer: AS_PATH is passed
          through untouched (no local-AS prepend or rewrites), the
          received next-hop is kept on forwarded routes, MED and
          communities pass through, and ADD-PATH on the client
          sessions avoids path hiding
    - note: |
        ### BFD over IPv6-unnumbered peers
        * An `interface-neighbor` (RA-discovered, IPv6 unnumbered)
          peer with BFD enabled established BGP but never transmitted
          a BFD control packet, so the session stayed Down: the
          ND-materialize path now re-runs the BFD reconcile, the
          all-`::` session key can no longer collide, and the egress
          interface is resolved for link-local addresses (#2324)
    - note: |
        ### Housekeeping
        * The `isis_srv6_base` BDD topology no longer carries a
          stale interface stanza that the interface-intent change in
          26.8.4 started reporting
- semver: 26.8.4
  date: 2026-08-27T18:00:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### IS-IS Area Proxy (RFC 9666)
        * A Level 1 area can now present itself to the Level 2
          backbone as a single node: `router isis area-proxy` with a
          `proxy-system-id` makes the router an Area Leader candidate,
          the RFC 9667 Area Leader sub-TLV drives the election over
          the L1 LSDB, and once every inside router signals readiness
          the leader distributes the proxy identity and originates the
          Proxy LSP under it — adjacencies, hostname and merged
          IPv4/IPv6 reachability at lowest metric per prefix
        * Inside Edge Routers enforce the boundary: L2 Hellos and SNPs
          on Outside Circuits are sourced from the Proxy System ID
          (`area-proxy inside|outside` overrides the per-interface
          classification), inside LSPs and the Area Proxy TLV never
          cross, and Outside Routers see exactly their own LSPs plus
          the Proxy LSP
        * Inside routers resolve proxy-pointing adjacencies back to
          the edge routers in their L2 SPF and rank intra-area metrics
          strictly below inter-area ones (§3.2), so routes beyond the
          boundary keep working; the Area Leader abdicates on loss of
          leadership and unreachable candidates are displaced
          immediately
        * Segment Routing rides along: SRGB merged across the inside
          area, Prefix-SIDs copied into the Proxy LSP with the P-Flag
          set, and an `area-proxy area-sid` anycast Node SID installed
          as a pop ILM on every Inside Edge Router
        * `show isis area-proxy` reports participation, the election,
          the readiness census and Proxy LSP origination; two BDD
          features (5-router abstraction with leader failover, and a
          3-router SR-MPLS topology) prove it end to end, and the
          book gains an Area Proxy chapter
    - note: |
        ### IS-IS TI-LFA micro-loop avoidance
        * `fast-reroute micro-loop-avoidance rib-update-delay` keeps
          an activated TI-LFA repair in use for a fixed interval after
          a local failure while the rest of the network converges,
          gated on SPF having observed the post-failure topology;
          activation failure, overlapping failures, recovery or a
          relevant config change fail open to normal convergence
    - note: |
        ### BGP multipath over unnumbered peers
        * `maximum-paths` now applies to interface-neighbor (IPv6
          unnumbered) peers: RFC 8950 paths carry no next-hop
          attribute, so both halves of multipath keyed every one of
          them to the same empty key and silently collapsed the set to
          one path — selection and FIB widening now key on the
          (link-local, ifindex) egress and install FRR-style
          v4-over-v6 ECMP legs, with BDD covering uplink loss,
          restore and runtime `maximum-paths` changes (#2318)
    - note: |
        ### Scaling for large peerings
        * The daemon raises RLIMIT_NOFILE at startup (hard limit to
          1048576 when privileged, soft limit to the hard limit
          otherwise) and the packaged unit sets `LimitNOFILE`, so a
          2000-peer BGP deployment no longer hits EMFILE under the
          inherited 1024-fd ceiling; the raise is logged only when it
          fails
        * The netlink FIB monitor socket runs with a 16 MiB receive
          buffer (`SO_RCVBUFFORCE`, falling back to `SO_RCVBUF`) and an
          overrun now triggers a rate-limited re-dump of links,
          addresses, neighbors and bridge MDB instead of silently
          desyncing the RIB from kernel state
    - note: |
        ### vty transports
        * `--vty-socket` is accepted by the vty shell and vtyctl
          (before or after the subcommand, `--host` still overrides),
          and `unix:/PATH` now means a filesystem Unix socket on the
          daemon and every client — stale files are unlinked, live ones
          refused, and authorization stays per-RPC via SO_PEERCRED —
          with `unix:@NAME` forcing the abstract socket; the book
          documents the transport-to-session posture
    - note: |
        ### Topology viewer and playsets
        * `zebra-topology snapshot --out <dir>` exports the FlexAlgo
          globe viewer as a convergence-guarded static site with every
          API response pre-fetched, `--algorithms` narrows the export
          (backing zebra.rs/topology/ and /topology0/), the globe gains
          selectable designs with Day as the default, and `?ui=off`
          hides the chrome for path-focused sharing
        * The isis-flexalgo-ai playset prompt links the new Flexible
          Algorithm configuration chapter
    - note: |
        ### Documentation and housekeeping
        * The MCP server chapter lists the JSON-RPC method surface,
          the BDD documents are refreshed, the isis-packet AUDIT.md
          records the Area Proxy security sweep, the `src/mup-c`
          module directory is renamed to `src/mup_c`, stale comments
          are dropped from main.rs, and Rust 1.98 clippy lints are
          addressed
- semver: 26.8.3
  date: 2026-08-11T18:00:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### BGP multipath
        * `maximum-paths` brings ECMP to BGP: paths that tie through
          the best-path comparison ladder install together as one
          multipath route, the set is ordered deterministically by the
          same ladder, and iBGP carries its own distinct limit
          (`maximum-paths ibgp`), all proven end to end by BDD
        * `suppress-fib-pending` withholds advertisement until the FIB
          reports the route installed, with the pending counters and
          the offloaded flag surfaced in the show views
        * Instance-level graceful restart now seeds onto peers created
          after the instance, and the ingress tag is carried through
          the peer shard into the Loc-RIB
    - note: |
        ### FPM southbound for SONiC
        * A new FPM tee, configured under `system fpm`, streams FIB
          programming to an external forwarding stack — verified
          against a live SONiC fpmsyncd programming APPL_DB — and
          routes are marked offloaded from the forwarding plane's
          acknowledgement
        * The tee survives repoints, peer outages and VRF deletion,
          reseeds on enable without stalling the RIB event loop, tees
          connected routes as FRR does, addresses VRF routes by the
          VRF device ifindex, and stops re-sending unchanged routes
        * `fpm-tap`, a recorder for the FPM wire format, joins the
          tools for capturing and replaying a programming session
    - note: |
        ### OSPF router identity discipline
        * An instance no longer speaks with a provisional identity:
          Hellos wait for the commit that configures the router-id to
          complete, LSAs keyed to a former router-id are flushed when
          the identity changes, and the hardcoded 10.0.0.1 fallback is
          gone — no identity, no wire
        * An OSPFv3 interface renumbering its link-local address now
          reinstalls the routes that resolved through it, closing a
          FIB blackhole that persisted until the next full SPF
    - note: |
        ### IS-IS and OSPF commit-boundary coalescing
        * IS-IS self-LSP generation parks while a commit is applying
          and flushes once at commit end through the normal throttle,
          so a multi-line commit floods one settled LSP instead of a
          half-applied one at a bumped sequence number
        * Pseudonode (DIS) origination goes through the same front
          door, keyed per pseudonode and sharing the lsp-gen-interval
          backoff, so LAN membership churn no longer regenerates at
          full rate while self-LSPs back off
        * Instances spawned by the commit's own first `router` line
          now start inside the gate in both protocols, and per-VRF
          children receive the commit-start signal, closing mid-commit
          races on fresh spawns
    - note: |
        ### IS-IS identity discipline
        * A circuit sends no IS-IS Hellos until a NET is configured —
          an enabled circuit used to speak with the all-zero system-id
          and could complete a full adjacency under that impostor
          identity; configuring the NET kicks Hellos on the enabled
          circuits immediately, proven live by a new BDD feature
    - note: |
        ### Config save format and the formal view
        * The default save format is CLI: the comment-only conffile
          the .deb ships counts as "nothing to load" instead of
          sniffing as YAML, so the first `save` on a default install
          writes CLI braces rather than silently rewriting the file
        * `show { running | candidate }-config formal` prints
          `set`-prefixed statements — the exact document `save formal`
          writes — so the output pastes into another vty's configure
          mode and loads as a config file as-is
    - note: |
        ### Book and reviews
        * The MUP book's two-VRF ST2 example moves its Direct segment
          into the N6 VRF, and a BDD feature regression-tests the
          chapter's configuration as written
        * Deep code reviews of the bgp-packet, isis-packet and
          ospf-packet crates record their findings in per-crate
          MUSE.md reports
        * A neighbor-group add-path opinion for MUP now fans to both
          MUP families, and policy call-cycle detection marks every
          member of the cycle rather than one edge's endpoints

- semver: 26.8.2
  date: 2026-08-07T18:00:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### VyOS-compatible firewall
        * The VyOS 1.5 firewall configuration tree is ported into the
          schema: `firewall group` (address, network, port, interface
          and mac groups plus the IPv6 variants), `firewall ipv4|ipv6`
          forward/input/output filter base chains and custom `name`
          chains carrying the mainstream matcher set, the prerouting
          and output raw hooks with notrack, and `global-options`
        * An nftables backend renders the whole ruleset and applies it
          atomically with `nft -f -`, following vyos-1x set naming,
          chain layout, state-policy, recent sets and log formats; an
          unrenderable rule is skipped with a warning naming it rather
          than breaking the emitted script
        * It runs on a new JSON batch config subscription: a commit
          touching any line under a registered path delivers the whole
          post-commit subtree as one JSON message, which suits
          consumers that recompile everything
        * `show firewall`, `... group`, `... ipv4|ipv6`, a single hook
          chain and `... name <chain>` join the configured ruleset
          with live kernel counters read from `nft --json list table`,
          with `-j` JSON on every view
        * `delete` may now complete at any config node, so
          `delete firewall` and other whole-subtree deletions behave
          as they do in VyOS; a bare `delete` is still rejected
    - note: |
        ### Site-to-site IPsec VPN
        * The VyOS `vpn ipsec` tree is ported: `authentication psk`,
          `esp-group` and `ike-group` with the full proposal cipher,
          hash and DH-group lists, `interface`, `log`, `options`, and
          `site-to-site peer` with per-tunnel traffic selectors and
          VTI binding — pre-shared-secret authentication
        * A strongSwan backend consumes the subtree over the same JSON
          batch subscription and renders a complete swanctl.conf —
          connections, pools and secrets — loaded declaratively with
          `swanctl -q` so that replace and teardown are one shape; the
          file is written 0600 and one unrepresentable peer is skipped
          with a warning instead of wedging the commit
        * `show vpn ipsec sa` and `... connections` read live data over
          charon's VICI control socket through a new in-tree client,
          while `state` and `policy` go through `ip xfrm`, mirroring
          the VyOS op-mode tables row for row
        * A BDD feature brings up two charon + zebra-rs nodes and
          proves live ESP traffic end to end
    - note: |
        ### Conditional schema and libyang 2.2
        * Schema nodes can be gated behind RFC 7950 features:
          `--feature [MODULE:]NAME` enables them at startup against the
          new zebra-features registry module, so `--feature iso` makes
          the firewall and VPN subtrees appear while a stock start is
          schema-identical to before
        * Gating works at enum and union-arm granularity as well as on
          containers — `set interface <name> ipv4 address dhcp` is an
          iso-only arm of the address leaf-list
        * libyang moved to 2.2 from crates.io, and schema-build
          diagnostics (skipped augments, dangling if-feature
          references) are logged as warnings instead of dropped
    - note: |
        ### Configuration file handling and vty
        * A failed `save` no longer panics the config loop and takes
          the daemon down with it; the write became an atomic rename
          that carries the existing file's mode across, and the reply
          names the path and format it wrote
        * `save` writes the config file back in the format it was
          loaded in — a YAML `--config-file` no longer silently comes
          back as CLI braces — and `save { cli | formal | json | yaml }`
          converts the file, adopting that format for later saves
        * The vty shell offers to commit uncommitted candidate edits
          when the session ends, whether by a typed `exit`, Ctrl-D or a
          closed terminal, so edits can no longer sit invisibly in the
          candidate after the operator walks away
    - note: |
        ### OSPF flooding and convergence
        * The link-state request list holds the neighbor's advertised
          LSA headers rather than our own copies, RFC 2328 §13.3 step
          1(b) is implemented in both flood fan-outs, and an LSA whose
          advertised instance beats our copy is now requested (§10.6)
        * A request satisfied by a parallel serve is no longer treated
          as BadLSReq, which could livelock a parallel exchange
        * The first Hello goes out immediately on interface-up, and a
          no-op origination no longer charges the MinLSInterval gate
    - note: |
        ### BGP and IS-IS
        * BGP paces the OpenSent redial with the idle-hold timer rather
          than ConnectRetry, so a session whose TCP dies after it has
          sent its OPEN — the RFC 4271 §6.8 collision loser — redials
          promptly; ConnectRetryTime now defaults to 30s, matching FRR
        * IS-IS re-keys BFD from the adjacency instead of the NFSM Up
          edge, so an address landing after the adjacency is already Up
          no longer loses the BFD subscribe for the life of that
          adjacency, and renumbering unsubscribes the stale session
        * `show segment-routing srv6 prefix` printed nothing at all;
          both spellings now resolve
    - note: |
        ### Labs, book and test infrastructure
        * Playset nodes boot on their own `--config-file` instead of
          having YAML pushed in with `vtyctl apply` after startup, so
          `save` in the vty writes back to the lab's own file; the lab
          READMEs were re-captured from live runs to match
        * The MUP, eBPF, VPWS, EVPN-over-SRv6, EVPN-over-MPLS, Type-5,
          VXLAN and bridge book chapters were brought current with the
          delivered datapaths, and stale YANG tee descriptions fixed
        * More BDD convergence asserts poll instead of sampling once,
          and the legacy `show interface <name> detail` command was
          removed

- semver: 26.8.1
  date: 2026-08-01T18:00:00+09:00
  distribution: unstable
  urgency: medium
  packager: Kunihiro Ishiguro <kunihiro@zebra.rs>
  changes:
    - note: |
        ### EVPN VPWS / E-LINE on all three encapsulations
        * EVPN VPWS (RFC 8214) point-to-point service now runs over
          SRv6, VXLAN and MPLS: per-EVI Ethernet A-D routes, Ethernet
          Segments derived from the attachment circuit, remote-PE
          selection, single-active multihoming with DF preference and
          a configurable DF startup delay
        * E-LINE cross-connect datapaths ship in the cradle eBPF
          engine for both VXLAN and MPLS transport, wired end-to-end
          from the EVPN control plane
        * `show evpn vni all` and EVPN service status views were
          implemented; an undefined outbound policy bound to an EVPN
          session no longer silently drops routes
    - note: |
        ### EVPN over MPLS and IPv6 transport
        * The E-LAN service gained a full MPLS encapsulation:
          per-EVI encap negotiation, service-label ILM programming
          with resync after engine restart, local MAC origination and
          a receive tee into the cradle engine
        * PEs can interconnect over pure IPv6 transport: MPLS service
          labels resolve over IPv6 nexthops (FIB6), every VXLAN
          service supports native IPv6 VTEPs with a new `vtep-source`
          leaf, and static ILM entries accept IPv6 nexthops with an
          optional `interface` leaf for the XDP fast path
        * Static label routes take IPv6 nexthops and multi-label
          stacks (leaf-list); a latent double-flood in the IMET flood
          filter was fixed
    - note: |
        ### EVPN over SRv6
        * MAC SIDs for Type-2 routes, ESI-carrying Type-2 routes,
          MAC/IP multihoming, multi-destination MAC moves and Type-5
          prefix routes are covered by new end-to-end BDD scenarios,
          with `show` views for the allocated SIDs
        * Route reflection now stamps ORIGINATOR_ID and CLUSTER_LIST
          for the EVPN, MUP and Flowspec address families (RFC 4456)
          and drops looped routes on ingress
    - note: |
        ### 5G Mobile User Plane (BGP MUP, SAFI 85)
        * MUP segment resolution was reworked: Interwork Segments can
          name the GTP-side VRF via `lookup-network-instance`, GTP
          gateways resolve through that VRF (nexthop cache is keyed
          per VRF), SID-less segments are accepted, and N9 / SRGW
          composite segments plus GTP over IPv6 are supported
        * A UPF with a single N6 interface now works (issue #1947),
          and GTP PDR matching honours the VRF
        * The N3-interface-in-a-VRF split was validated live against
          free5GC (UE ping end-to-end), including an N4-separated
          faithful variant; the lab and book chapter ship in-tree
    - note: |
        ### Interface addressing: secondaries, multiple addresses, VLANs
        * Interfaces accept multiple IPv4 addresses with a
          `secondary` flag and multiple IPv6 addresses (leaf-list
          config); router-id derivation skips secondaries and the RIB
          keeps connected coverage when a covering address is removed
        * OSPFv2 handles secondary addresses per RFC 2328: TX source
          pinning, §10.5 ingress checks, LSA re-origination on
