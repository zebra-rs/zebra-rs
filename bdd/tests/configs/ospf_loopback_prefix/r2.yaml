# r2 — OSPFv2 and OSPFv3 over one point-to-point link to r1, with lo
# enabled in both. The kernel adds 127.0.0.1/8 and ::1/128 to lo next
# to the configured loopback addresses.
interface:
- if-name: lo
  ipv4:
    address: 10.0.0.2/32
  ipv6:
    address: 2001:db8::2/128
- if-name: r2-r1
  ipv4:
    address: 192.168.12.2/24
  ipv6:
    address: 2001:db8:12::2/64
router:
  ospf:
    router-id: 10.0.0.2
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
      - if-name: r2-r1
        enabled: true
        network-type: point-to-point
  ospfv3:
    router-id: 10.0.0.2
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
      - if-name: r2-r1
        enabled: true
        network-type: point-to-point
