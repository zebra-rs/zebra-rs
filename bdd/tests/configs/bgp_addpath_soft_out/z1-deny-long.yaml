# z1 (DUT, AS 65001): learns 10.62.1.0/24 from two scripted speakers — h1
# (AS_PATH "65081") and h2 (AS_PATH "65082 65009 65010") — and sends both
# paths to z2 with AddPath.
# The out-policy toward z2 denies paths whose AS_PATH (as sent — z1's AS
# prepended) has three or more ASes: h2's path.
policy:
- name: DENY-LONG
  entry:
  - number: 10
    action: deny
    match:
      as-path-len:
        ge: 3
  - number: 20
    action: permit
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.62.1
    timer:
      adv-interval:
        ibgp: 1
        ebgp: 1
    neighbor:
    # The scripted speakers never listen on 179: passive keeps these peers
    # in Active so the scripts' connects are accepted.
    - remote-address: 192.168.62.2
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      remote-as: 65081
      transport:
        passive-mode: true
    - remote-address: 192.168.62.3
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      remote-as: 65082
      transport:
        passive-mode: true
    - remote-address: 192.168.62.4
      afi-safi:
      - name: ipv4
        enabled: true
        add-path: send-receive
        policy:
          out: DENY-LONG
      enabled: true
      remote-as: 65072
