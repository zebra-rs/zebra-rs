# PE (AS 65000). vrf-cust holds two PE-CE eBGP neighbors to the CE — one
# over IPv4 transport (ipv4 unicast), one over IPv6 transport (ipv6
# unicast) — each with `advertisement-interval 0`. This is the only way
# to give a per-VRF neighbor a non-default MRAI: the instance-level
# `router bgp timer adv-interval` snapshot never reaches the per-VRF task.
#
# The PE originates one prefix per family into vrf-cust with a plain
# `network` statement. With adv-interval 0 the CE must receive both
# without waiting out the stock 5s/30s MRAI.
vrf:
- name: vrf-cust
  ipv4:
    route-target:
      import:
      - 65000:100
      export:
      - 65000:100
  ipv6:
    route-target:
      import:
      - 65000:100
      export:
      - 65000:100
interface:
- if-name: lo
  ipv4:
    address: 1.1.1.1/32
- if-name: ce1
  vrf: vrf-cust
  ipv4:
    address: 10.1.0.1/30
  ipv6:
    address: 2001:db8:1::1/64
router:
  bgp:
    global:
      as: 65000
      router-id: 1.1.1.1
    vrf:
    - name: vrf-cust
      rd: 65000:1
      neighbor:
      - remote-address: 10.1.0.2
        remote-as: 65001
        timers:
          advertisement-interval: 0
        afi-safi:
        - name: ipv4
          enabled: true
      - remote-address: 2001:db8:1::2
        remote-as: 65001
        timers:
          advertisement-interval: 0
        afi-safi:
        - name: ipv6
          enabled: true
      afi-safi:
        ipv4:
          network:
          - prefix: 10.9.0.0/24
        ipv6:
          network:
          - prefix: 2001:db8:9::/64
