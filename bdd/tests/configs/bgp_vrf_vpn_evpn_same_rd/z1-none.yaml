# As z1-both.yaml, but both out-policies deny everything: z2 loses both
# copies, and vrf-blue must lose the prefix.
policy:
- name: PERMIT-ALL
  entry:
  - number: 10
    action: permit
- name: DENY-ALL
  entry:
  - number: 10
    action: deny
vrf:
- name: vrf-blue
  ipv4:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    neighbor:
    - remote-address: 192.168.0.2
      afi-safi:
      - name: vpnv4
        enabled: true
        policy:
          out: DENY-ALL
      - name: evpn
        enabled: true
        policy:
          out: DENY-ALL
      enabled: true
      remote-as: 65001
    vrf:
    - name: vrf-blue
      rd: 65001:100
      evpn:
        advertise-ipv4: true
      afi-safi:
        ipv4:
          network:
          - prefix: 10.1.0.0/24
