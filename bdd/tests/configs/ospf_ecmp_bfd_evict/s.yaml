interface:
- if-name: lo
  ipv4:
    address: 10.0.0.1/32
- if-name: s-a
  ipv4:
    address: 10.1.0.1/30
- if-name: s-b
  ipv4:
    address: 10.2.0.1/30
router:
  ospf:
    router-id: 10.0.0.1
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
      - if-name: s-a
        enabled: true
        network-type: point-to-point
        cost: 1
        bfd:
          enabled: true
      - if-name: s-b
        enabled: true
        network-type: point-to-point
        cost: 1
