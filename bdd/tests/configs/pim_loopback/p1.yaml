# PIM and PIMv6 on lo, which keeps only 127.0.0.1 and ::1, and PIM on
# eth1 toward p2.
interface:
- if-name: eth1
  ipv4:
    address: 10.1.12.1/24
router:
  pim:
    interface:
    - if-name: lo
      enabled: true
    - if-name: eth1
      enabled: true
    ipv6:
      interface:
      - if-name: lo
        enabled: true
