# z2 (PE, RD 65001:2) originates 10.5.0.0/24 and 10.6.0.0/24 in vrf-blue
# and imports z1's copies of both.
vrf:
- name: vrf-blue
  ipv4:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    neighbor:
    - remote-address: 192.168.0.1
      afi-safi:
      - name: vpnv4
        enabled: true
      enabled: true
      remote-as: 65001
    vrf:
    - name: vrf-blue
      rd: 65001:2
      afi-safi:
        ipv4:
          network:
          - prefix: 10.5.0.0/24
          - prefix: 10.6.0.0/24
