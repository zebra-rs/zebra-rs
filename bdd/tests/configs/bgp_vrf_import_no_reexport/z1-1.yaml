# z1 (PE, RD 65001:1) originates 10.5.0.0/24 with a vrf-blue `network`
# and learns 10.6.0.0/24 from its CE c1; it imports z2's copies of both.
vrf:
- name: vrf-blue
  ipv4:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
interface:
- if-name: c1
  vrf: vrf-blue
  ipv4:
    address: 10.9.0.1/30
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    neighbor:
    - remote-address: 192.168.0.2
      afi-safi:
      - name: vpnv4
        enabled: true
      enabled: true
      remote-as: 65001
    vrf:
    - name: vrf-blue
      rd: 65001:1
      neighbor:
      - remote-address: 10.9.0.2
        remote-as: 65100
        afi-safi:
        - name: ipv4
          enabled: true
      afi-safi:
        ipv4:
          network:
          - prefix: 10.5.0.0/24
