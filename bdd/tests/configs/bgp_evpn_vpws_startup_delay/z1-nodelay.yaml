# z1 — es1 with no `df-election` block at all. Applying this over a config
# that had a startup-delay deletes the leaf, which releases any hold still
# running: z1 re-originates es1's Type-4, rejoins the candidate set, and the
# election runs again. Otherwise identical to z1-1.yaml, so the segment and
# the service are unchanged and only the hold moves.
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
    behavior: usid
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    segment-routing:
      srv6:
        locator: LOC1
    afi-safi:
    - name: evpn
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: ce1
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 103
        interface: ce1
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
