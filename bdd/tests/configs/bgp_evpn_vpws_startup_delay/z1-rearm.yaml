# z1 — same as z1-1.yaml but with a 300s startup-delay, applied to a
# segment that is already live and already elected. Configuring the delay
# on a live segment re-arms the hold: z1 retracts es1's Type-4, drops out of
# the election, and would stay out for five minutes. The scenario using this
# does not wait for it — it clears the delay (z1-nodelay.yaml) to prove that
# releasing the knob ends the hold at once rather than after the timer.
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
    behavior: usid
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    segment-routing:
      srv6:
        locator: LOC1
    afi-safi:
    - name: evpn
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: ce1
        df-election:
          startup-delay: 300
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 103
        interface: ce1
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
