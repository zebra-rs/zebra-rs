# z1 — the PE under test: dual-homed to the CE with z2 over Ethernet
# Segment es1, but configured with a 50s `df-election startup-delay`. This
# is the boot config, so applying it is z1 "joining the segment": the hold
# arms immediately and z1 withholds es1's Type-4 and per-ES A-D, keeping
# itself out of z2's DF-election candidate set until the timer fires.
#
# 50s is chosen to outlast the setup scenario (which waits 10s for BGP) and
# still land inside the 60-attempt `should eventually` budget of the
# scenario that waits for the hold to elapse.
#
# Control-plane only — no cradle dataplane.
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
    behavior: usid
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    segment-routing:
      srv6:
        locator: LOC1
    afi-safi:
    - name: evpn
      encapsulation: srv6
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: ce1
        df-election:
          startup-delay: 50
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 103
        interface: ce1
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
