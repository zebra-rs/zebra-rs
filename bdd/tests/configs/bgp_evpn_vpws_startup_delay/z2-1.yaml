# z2 — the incumbent Designated Forwarder, and the reason z1 holds. Same
# Ethernet Segment es1 and the same VPWS service instance id 101 as z1: the
# two PEs are one logical endpoint of eline1. No startup-delay of its own,
# so z2 elects immediately.
#
# While z1 holds, z2 is the only candidate on the segment and carries the
# service alone (ordinal 101 % 1 = 0). Once z1 joins, the candidate list
# becomes [.0.1, .0.2] and instance 101 carves to ordinal 101 % 2 = 1 — z2
# keeps the DF role and z1 becomes its backup.
#
# Control-plane only — no cradle dataplane.
segment-routing:
  locator:
  - name: LOC2
    prefix: fcbb:bbbb:2::/48
    behavior: usid
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    segment-routing:
      srv6:
        locator: LOC2
    afi-safi:
    - name: evpn
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: ce1
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 103
        interface: ce1
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
