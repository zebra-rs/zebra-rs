# z2 — dual-homed PE, es1 flipped to all-active (RFC 8214 §5). Pairs with
# z1-allactive.yaml: both ends of the segment advertise P=1 for instance 101.
segment-routing:
  locator:
  - name: LOC2
    prefix: fcbb:bbbb:2::/48
    behavior: usid
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    segment-routing:
      srv6:
        locator: LOC2
    afi-safi:
    - name: evpn
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: all-active
        interface: ce1
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 103
        interface: ce1
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
