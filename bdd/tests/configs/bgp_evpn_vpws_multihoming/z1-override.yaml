# z1 — same ambiguous pair as z1-ambiguous.yaml, resolved by naming es2 on
# the `ethernet-segment` leaf. The override wins over inference and the
# Type-1 re-keys onto es2's ESI; z2 stays on es1, so z1 is now alone on its
# segment and elects itself primary.
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
    behavior: usid
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    segment-routing:
      srv6:
        locator: LOC1
    afi-safi:
    - name: evpn
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: ce1
      - name: es2
        esi: "00:aa:bb:cc:dd:ee:ff:01:02:03"
        redundancy-mode: single-active
        interface: ce1
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 103
        interface: ce1
        ethernet-segment: es2
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
