# z1 — two Ethernet Segments both claim access port ce1, and eline1 names
# neither. Inference cannot pick one, so the service stays single-homed and
# `show bgp evpn vpws` reports both candidates instead of guessing an ESI.
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
    behavior: usid
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    segment-routing:
      srv6:
        locator: LOC1
    afi-safi:
    - name: evpn
      encapsulation: srv6
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: ce1
      - name: es2
        esi: "00:aa:bb:cc:dd:ee:ff:01:02:03"
        redundancy-mode: single-active
        interface: ce1
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 103
        interface: ce1
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
