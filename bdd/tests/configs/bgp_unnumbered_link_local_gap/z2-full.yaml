# Phase 2: RA on i1 and the interface-keyed neighbor (see z1-full.yaml).
interface:
- if-name: i1
  ipv6:
    router-advertisements:
      send-advertisements: true
router:
  bgp:
    global:
      as: 65002
      router-id: 2.2.2.2
    timer:
      adv-interval:
        ebgp: 1
    interface-neighbor:
    - interface: i1
      remote-as: 65001
    afi-safi:
    - name: ipv4
      network:
      - prefix: 10.0.0.2/32
