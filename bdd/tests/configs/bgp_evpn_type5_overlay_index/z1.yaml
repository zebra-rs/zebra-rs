router:
  bgp:
    global:
      as: 65000
      router-id: 192.168.31.1
    neighbor:
    # The scripted Type-5 speaker on h1 never listens on 179, so dialing
    # it just cycles this peer Idle -> Connect -> Idle, and Idle refuses
    # the inbound connection. Passive parks the peer in Active listening
    # so the script's connect is always accepted.
    - remote-address: 192.168.31.2
      afi-safi:
      - name: evpn
        enabled: true
      enabled: true
      remote-as: 65000
      route-reflector:
        client: true
      transport:
        passive-mode: true
    - remote-address: 192.168.31.3
      afi-safi:
      - name: evpn
        enabled: true
      enabled: true
      remote-as: 65000
      route-reflector:
        client: true
