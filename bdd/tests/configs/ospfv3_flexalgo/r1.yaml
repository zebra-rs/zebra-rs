# r1 — advertises algorithm 128 at priority 100, excluding red (which colors
# nothing); r2's definition outranks it.
affinity-map:
  affinity:
  - name: blue
    bit-position: 0
  - name: red
    bit-position: 1

interface:
- if-name: lo
  ipv6:
    address: 2001:db8::1/128
- if-name: r1-r2
  ipv6:
    address: 2001:db8:12::1/64
- if-name: r1-r4
  ipv6:
    address: 2001:db8:14::1/64

router:
  ospfv3:
    router-id: 10.0.0.1
    segment-routing:
      mpls: {}
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
        prefix-sid:
          index: 1
        flex-algo-prefix-sid:
        - algo: 128
          index: 1281
      - if-name: r1-r2
        enabled: true
        network-type: point-to-point
        cost: 10
        affinity:
        - blue
      - if-name: r1-r4
        enabled: true
        network-type: point-to-point
        cost: 10
    flex-algo:
    - algo: 128
      advertise-definition: true
      priority: 100
      dataplane:
        sr-mpls: true
      affinity:
        exclude-any:
        - red
