# z1: originates an EVPN Type-5 for 10.1.0.0/24 toward z2; both ends
# negotiate long-lived graceful restart with a 10 s stale time for evpn.
vrf:
- name: vrf-blue
  ipv4:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    neighbor:
    - remote-address: 192.168.0.2
      afi-safi:
      - name: evpn
        enabled: true
        long-lived-graceful-restart:
          enabled: true
          restart-time: 10
      enabled: true
      remote-as: 65001
    vrf:
    - name: vrf-blue
      rd: 65001:100
      evpn:
        advertise-ipv4: true
      afi-safi:
        ipv4:
          network:
          - prefix: 10.1.0.0/24
