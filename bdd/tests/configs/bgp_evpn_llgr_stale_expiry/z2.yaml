# z2: receives z1's Type-5; LLGR for evpn with a 10 s stale time, so
# z1's rows are retained stale when its session dies and must be swept
# 10 s later.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    neighbor:
    - remote-address: 192.168.0.1
      afi-safi:
      - name: evpn
        enabled: true
        long-lived-graceful-restart:
          enabled: true
          restart-time: 10
      enabled: true
      remote-as: 65001
