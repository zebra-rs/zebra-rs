# CE1 (AS 65001), the observer. It never dials (both neighbors are
# passive), so a session comes up only when PE1 dials from that
# neighbor's address.
#
# - 10.2.0.1: the address of PE1's `ce2`, reached through PE1. A session
#   with it is a session PE1 sourced from `ce2`, as its `update-source
#   ce2` asks.
# - 10.1.0.1: PE1's address on the link to CE1, the source the kernel
#   picks when PE1 binds none. A session with it is PE1 dialing without
#   the source it was asked for.
interface:
- {if-name: lo, ipv4: {address: 10.0.1.1/32}}
- {if-name: pe1, ipv4: {address: 10.1.0.2/30}}
router:
  static:
    ipv4:
      route:
      - prefix: 10.2.0.0/30
        nexthop:
        - address: 10.1.0.1
  bgp:
    global: {as: 65001, router-id: 10.0.1.1}
    neighbor:
    - remote-address: 10.2.0.1
      remote-as: 65000
      enabled: true
      transport: {passive-mode: true}
      afi-safi:
      - name: ipv4
        enabled: true
    - remote-address: 10.1.0.1
      remote-as: 65000
      enabled: true
      transport: {passive-mode: true}
      afi-safi:
      - name: ipv4
        enabled: true
