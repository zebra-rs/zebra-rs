# z2 — the stable observer. Its own locator LOC2 resolves normally, so
# every assertion about a missing SID on z2's view is specifically about
# z1's routes: z2's own SIDs render as "Local SID", z1's as "Remote SID".
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::2/128
- if-name: z2z1
  ipv6:
    address: 2001:db8:12::2/64
segment-routing:
  locator:
  - name: LOC2
    prefix: fcbb:bbbb:2::/48
    behavior: usid
vxlan:
- name: vxlan10
  vni: 10
  local-address: 2001:db8::2
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    segment-routing:
      srv6:
        locator: LOC2
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      encapsulation: srv6
    neighbor:
    - remote-address: 2001:db8:12::1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
