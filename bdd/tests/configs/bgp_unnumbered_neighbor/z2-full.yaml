# Phase 2 for z2 — mirror of z1-full.yaml with the AS numbers swapped.
interface:
- if-name: i1
  ipv6:
    router-advertisements:
      send-advertisements: true
router:
  bgp:
    global:
      as: 65002
      router-id: 2.2.2.2
    # BFD over the unnumbered link (regression for #2324): the
    # blanket instance-level default enables single-hop BFD on the
    # interface-neighbor, keyed on the RA-learned link-local and
    # pinned to i1's ifindex.
    bfd:
      enabled: true
    interface-neighbor:
    - interface: i1
      remote-as: 65001
    afi-safi:
    - name: ipv4
      network:
      - prefix: 10.0.0.2/32
      - prefix: 10.10.2.0/24
