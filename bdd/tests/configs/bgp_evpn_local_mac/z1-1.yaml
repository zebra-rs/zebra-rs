# z1 — an EVPN PE with a local VXLAN (VNI 10) and `advertise-all-vni`.
# The bridge br10 (its own address 02:00:00:00:fe:01) and the access
# port host0 (02:00:00:00:0a:01) are created by the feature.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.1
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
