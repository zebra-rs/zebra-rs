# z3 — eBGP peer of z1 only, originating 10.50.1.0/24: a peer path for a
# prefix z1 also redistributes.
router:
  bgp:
    global:
      as: 65003
      router-id: 10.0.0.3
    timer:
      adv-interval:
        ebgp: 1
    neighbor:
    - remote-address: 10.0.0.1
      timers: {connect-retry-time: 3}
      remote-as: 65001
      enabled: true
    afi-safi:
    - name: ipv4
      network:
      - prefix: 10.50.1.0/24
