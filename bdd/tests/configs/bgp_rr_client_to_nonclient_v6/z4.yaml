# z4 — non-client iBGP peer of the reflector; originates 2001:db8:40::/64.
router:
  bgp:
    global:
      as: 65001
      router-id: 10.50.0.4
    neighbor:
    - remote-address: 2001:db8:50::1
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65001
    afi-safi:
    - name: ipv6
      network:
      - prefix: 2001:db8:40::/64
