# VTEP B: originates an EVPN Type-5 for 2001:db8:1::/64 under
# RD 65001:100 — the SAME RD as the other VTEP, so the reflector holds two
# candidates for one EVPN key (the AddPath case).
vrf:
- name: vrf-blue
  ipv6:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.4
    neighbor:
    - remote-address: 192.168.0.2
      afi-safi:
      - name: evpn
        enabled: true
      enabled: true
      remote-as: 65001
    vrf:
    - name: vrf-blue
      rd: 65001:100
      evpn:
        advertise-ipv6: true
      afi-safi:
        ipv6:
          network:
          - prefix: 2001:db8:1::/64
