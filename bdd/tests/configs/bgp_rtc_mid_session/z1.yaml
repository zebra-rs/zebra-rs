# z1 (PE, AS 65000): exports 10.29.1.0/24 from VRF red with RT 65000:100 and
# 10.29.2.0/24 from VRF green with RT 65000:200, and sends them to z2 over
# iBGP vpnv4, constrained by z2's rtcv4 membership (RFC 4684).
vrf:
- name: red
  ipv4:
    route-target:
      export:
      - 65000:100
- name: green
  ipv4:
    route-target:
      export:
      - 65000:200
router:
  bgp:
    global:
      as: 65000
      router-id: 192.168.67.1
    timer:
      adv-interval:
        ibgp: 1
        ebgp: 1
    neighbor:
    - remote-address: 192.168.67.2
      remote-as: 65000
      enabled: true
      afi-safi:
      - name: vpnv4
        enabled: true
      - name: rtcv4
        enabled: true
    vrf:
    - name: red
      rd: 65000:1
      afi-safi:
        ipv4:
          network:
          - prefix: 10.29.1.0/24
    - name: green
      rd: 65000:3
      afi-safi:
        ipv4:
          network:
          - prefix: 10.29.2.0/24
