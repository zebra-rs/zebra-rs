# z4 — eBGP originator (AS 65002); each variant adds one more prefix so a
# fresh best-path event runs through z1's update-group memo.
router:
  bgp:
    global:
      as: 65002
      router-id: 10.71.0.4
    neighbor:
    - remote-address: 2001:db8:70::1
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65001
    afi-safi:
    - name: ipv6
      network:
      - prefix: 2001:db8:41::/64
