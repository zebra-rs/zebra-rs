# z2 (AS 65042): the downstream peer that must not be left holding the
# churned prefix.
router:
  bgp:
    global:
      as: 65042
      router-id: 192.168.40.3
    neighbor:
    - remote-address: 192.168.40.1
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      remote-as: 65040
