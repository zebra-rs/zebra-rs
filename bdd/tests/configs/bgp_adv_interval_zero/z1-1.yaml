vrf:
- name: vrf-blue
  ipv4:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    timer:
      adv-interval:
        ibgp: 0
    neighbor:
    - remote-address: 192.168.0.2
      afi-safi:
      - name: ipv4
        enabled: true
      - name: vpnv4
        enabled: true
      - name: evpn
        enabled: true
      enabled: true
      remote-as: 65001
    afi-safi:
    - name: ipv4
      network:
      - prefix: 10.0.0.1/32
    vrf:
    - name: vrf-blue
      rd: 65001:100
      evpn:
        advertise-ipv4: true
      afi-safi:
        ipv4:
          network:
          - prefix: 10.1.0.0/24
