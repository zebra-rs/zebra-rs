# z1 — plain locator. The feature adds a kernel route here that steers
# 2001:db8:300::/64 through z2's End SID to z3's pinned End.DT6 SID.
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::1/128
- if-name: z1-z2
  ipv6:
    address: 2001:db8:12::1/64
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
router:
  ospfv3:
    router-id: 10.0.0.1
    segment-routing:
      srv6:
        locator: LOC1
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
      - if-name: z1-z2
        enabled: true
        network-type: point-to-point
