# z2 — the node under test: a classic locator flavored `psp` and `usd`,
# on the kernel data plane. The kernel performs PSP on End only and USD
# nowhere, and refuses the whole route for a flavor it does not perform:
# the End SID must land with what it accepts, the two End.X SIDs plain.
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::2/128
- if-name: z2-z1
  ipv6:
    address: 2001:db8:12::2/64
- if-name: z2-z3
  ipv6:
    address: 2001:db8:23::2/64
segment-routing:
  locator:
  - name: LOC2
    prefix: fcbb:bbbb:2::/48
    flavor:
    - psp
    - usd
router:
  ospfv3:
    router-id: 10.0.0.2
    segment-routing:
      srv6:
        locator: LOC2
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
      - if-name: z2-z1
        enabled: true
        network-type: point-to-point
      - if-name: z2-z3
        enabled: true
        network-type: point-to-point
