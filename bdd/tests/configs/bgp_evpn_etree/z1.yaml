# z1 — an EVPN/VXLAN PE whose bridge br10 (VNI 10) has three access ports:
# l1 and l2 (to become E-Tree leaf ACs) and r1 (a root). `advertise-all-vni`
# originates a Type-2 per MAC learned on any of them.
#
# No `system ebpf` yet: the feature first shows that a leaf AC is refused
# without the cradle data plane. z1-etree.yaml then turns everything on.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.1
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
