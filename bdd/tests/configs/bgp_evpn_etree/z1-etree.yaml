# z1 with the managed cradle engine, its three access ports attached to it,
# and l1 and l2 made E-Tree leaf ACs. Applied whole: it replaces z1.yaml.
#
# Under cradle the engine is the L2 data plane: it switches the ports, keeps
# a leaf from another leaf, and reports the MACs it learns — which is what
# z1 advertises (the kernel bridge's own learns are not used).
system:
  ebpf:
    enabled: true
interface:
- if-name: l1
  ebpf:
    enabled: true
- if-name: l2
  ebpf:
    enabled: true
- if-name: r1
  ebpf:
    enabled: true
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.1
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      etree:
        leaf-interface:
        - name: l1
        - name: l2
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
