# r3 — starts on the default SRGB (16000, 8000 labels): its Prefix-SID
# index 3 is label 16003.
interface:
- if-name: lo
  ipv4:
    address: 10.0.0.3/32
- if-name: r3-r2
  ipv4:
    address: 10.0.23.3/24
system:
  hostname: r3
router:
  isis:
    net: 49.0000.0000.0000.0003.00
    hostname: r3
    is-type: level-2-only
    segment-routing:
      mpls: {}
    interface:
    - if-name: lo
      ipv4:
        enabled: true
        prefix-sid:
          index: 3
    - if-name: r3-r2
      network-type: point-to-point
      ipv4:
        enabled: true
