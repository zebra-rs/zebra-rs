# r2 — r3's penultimate hop: its ILM pops r3's Prefix-SID label.
interface:
- if-name: lo
  ipv4:
    address: 10.0.0.2/32
- if-name: r2-r1
  ipv4:
    address: 10.0.12.2/24
- if-name: r2-r3
  ipv4:
    address: 10.0.23.2/24
system:
  hostname: r2
router:
  isis:
    net: 49.0000.0000.0000.0002.00
    hostname: r2
    is-type: level-2-only
    segment-routing:
      mpls: {}
    interface:
    - if-name: lo
      ipv4:
        enabled: true
        prefix-sid:
          index: 2
    - if-name: r2-r1
      network-type: point-to-point
      ipv4:
        enabled: true
    - if-name: r2-r3
      network-type: point-to-point
      ipv4:
        enabled: true
