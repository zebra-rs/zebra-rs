# z2 — on single-active segment es1 with preference 300, signalling its role.
# Peers ONLY with z3. The two segment PEs can no longer see each other's
# Type-4, so each elects over a candidate set of one and BOTH claim the role —
# the divergence RFC 8584 election depends on not happening.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.2
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: host0
        role-signaling: l2-attr
        df-election:
          algorithm: preference
          preference: 300
    neighbor:
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
