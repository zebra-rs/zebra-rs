# z2 — on single-active segment es1 with preference 300, signalling its role.
# Peers with the other segment PE and with z3, so both PEs elect over the
# SAME candidate set and agree on one Designated Forwarder.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.2
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: host0
        role-signaling: l2-attr
        df-election:
          algorithm: preference
          preference: 300
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
