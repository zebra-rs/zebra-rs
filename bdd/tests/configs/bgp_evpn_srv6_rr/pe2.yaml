# pe2 — the receiving PE, also peering only with the reflector. It has no
# locator of its own, so ANY SID visible in its EVPN RIB necessarily came
# from pe1 through the reflector; a "Local SID" line here would mean the
# assertion was reading pe2's own state instead of the reflected route.
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::2/128
- if-name: pe2rr
  ipv6:
    address: 2001:db8:23::2/64
vxlan:
- name: vxlan10
  vni: 10
  local-address: 2001:db8::2
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      encapsulation: srv6
    neighbor:
    - remote-address: 2001:db8:23::3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
