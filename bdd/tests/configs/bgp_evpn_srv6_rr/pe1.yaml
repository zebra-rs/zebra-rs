# pe1 — the originating PE. Peers ONLY with the reflector, so every route
# pe2 sees from it has been reflected. `encapsulation srv6` puts a per-VNI
# End.DT2U on its Type-2 and an End.DT2M on its Type-3, carved from LOC1.
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::1/128
- if-name: pe1rr
  ipv6:
    address: 2001:db8:13::1/64
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
    behavior: usid
vxlan:
- name: vxlan10
  vni: 10
  local-address: 2001:db8::1
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    segment-routing:
      srv6:
        locator: LOC1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      encapsulation: srv6
    neighbor:
    - remote-address: 2001:db8:13::3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
