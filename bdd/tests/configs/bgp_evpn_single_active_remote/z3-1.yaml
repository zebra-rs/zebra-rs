# z3 — the remote ingress PE. It is on NO Ethernet Segment and has no access
# port: it only receives the segment's routes, which is exactly the position
# RFC 7432 leaves without an answer. It holds no Type-4 (the ES-Import RT is
# not imported here), so it cannot re-run the DF election and must read the
# forwarder off the per-EVI A-D's Layer-2 Attributes EC.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.3
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.3
    afi-safi:
    - name: evpn
      advertise-all-vni: true
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
