# z1 — one of two PEs on single-active Ethernet Segment es1, signalling its
# elected role (rfc7432bis §7.11.1). Preference 200 under RFC 9785 Alg 2 pins
# the election, so which PE claims P is a property of the config. Both peer
# with z3, the remote ingress PE that has to act on what they say.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.1
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: host0
        role-signaling: l2-attr
        df-election:
          algorithm: preference
          preference: 200
    neighbor:
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
