# z2 variant: the vpws service removed (segment membership kept) — its
# per-EVI Type-1 is withdrawn and z3 must fail over to z1's backup
# endpoint, VTEP and VNI both.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: ce1
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
