# z3 — the single-homed remote end of the E-Line (VNI 5333), binding
# whichever attached PE the RFC 8214 §5 election makes primary.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.3
    afi-safi:
    - name: evpn
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 103
        remote-service-id: 101
        interface: ce3
        vni: 5333
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
