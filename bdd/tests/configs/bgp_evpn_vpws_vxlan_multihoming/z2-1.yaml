# z2 — the other attached PE of es1 (VNI 5222). Instance 101 carves to
# z2, so it advertises P=1 and z3 binds its VTEP+VNI.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: ce1
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 103
        interface: ce1
        vni: 5222
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
