# z2: receives z1's VPNv6 route; LLGR for vpnv6 with a 10 s stale time,
# so z1's rows are retained stale when its session dies and must be
# swept 10 s later.
vrf:
- name: vrf-cust
  ipv6:
    route-target:
      import:
      - 64512:100
      export:
      - 64512:100
router:
  bgp:
    global:
      as: 64512
      router-id: 192.168.0.2
    neighbor:
    - remote-address: 192.168.0.1
      afi-safi:
      - name: vpnv6
        enabled: true
        long-lived-graceful-restart:
          enabled: true
          restart-time: 10
      - name: ipv4
        enabled: false
      enabled: true
      remote-as: 64512
    vrf:
    - name: vrf-cust
      rd: 64512:2
