# z2 — mirror of z1 on LOC2. Imports z1's Type-2 / Type-3 by the
# auto-derived route-target (AS:VNI = 65001:10) and binds the remote
# End.DT2U SID to the MAC in its EVPN MAC table.
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::2/128
- if-name: z2z1
  ipv6:
    address: 2001:db8:12::2/64
segment-routing:
  locator:
  - name: LOC2
    prefix: fcbb:bbbb:2::/48
    behavior: usid
vxlan:
- name: vxlan10
  vni: 10
  local-address: 2001:db8::2
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    segment-routing:
      srv6:
        locator: LOC2
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      encapsulation: srv6
    neighbor:
    - remote-address: 2001:db8:12::1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
  static:
    ipv6:
      route:
      - prefix: fcbb:bbbb:1::/48
        nexthop:
        - address: 2001:db8:12::1
