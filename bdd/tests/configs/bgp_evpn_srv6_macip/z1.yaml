# z1 — an EVPN-over-SRv6 VTEP (RFC 9252). `advertise-all-vni` originates
# Type-2 (MAC/IP) and Type-3 (IMET) routes for VNI 10; `encapsulation srv6`
# makes them carry SRv6 L2 Service SIDs carved from LOC1 — a per-VNI
# End.DT2U on the Type-2 and an End.DT2M on the Type-3 — instead of the
# VXLAN encapsulation extended community.
#
# Control-plane only: the L2 datapath for End.DT2U/DT2M is the cradle eBPF
# tee (the kernel has no seg6local action for them), so `system ebpf` is
# deliberately absent here. What this config exercises is the origination,
# the SID carve, the advertisement and the receive/import bookkeeping.
#
# The static route to z2's locator lets the received service SIDs resolve
# through a next hop; there is no IGP in this two-node topology.
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::1/128
- if-name: z1z2
  ipv6:
    address: 2001:db8:12::1/64
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
    behavior: usid
vxlan:
- name: vxlan10
  vni: 10
  local-address: 2001:db8::1
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    segment-routing:
      srv6:
        locator: LOC1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      encapsulation: srv6
    neighbor:
    - remote-address: 2001:db8:12::2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
  static:
    ipv6:
      route:
      - prefix: fcbb:bbbb:2::/48
        nexthop:
        - address: 2001:db8:12::2
