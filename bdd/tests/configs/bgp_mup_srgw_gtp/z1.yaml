# z1 — owns BOTH remote MUP segments the SRGW (z2) resolves against:
# VRF ACC (`segment interwork prefix 10.0.0.0/24`, the gNB N3 network) and
# VRF ANC (`segment direct { mup-ext-comm 1:2 }`, the anchor). Each is
# `encapsulation srv6`, carving an End.DT46 SID from locator S; the ISD and
# DSD ride iBGP (mup) to z2 with their export RTs.
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::1/128
- if-name: z1-z2
  ipv6:
    address: 2001:db8:0:12::1/64
segment-routing:
  locator:
  - name: S
    prefix: fcbb:bbbb:1::/48
    behavior: usid
vrf:
- name: ACC
  mup:
    route-target:
      export:
      - "65501:10"
- name: ANC
  mup:
    route-target:
      export:
      - "65501:30"
router:
  isis:
    net: 49.0000.0000.0000.0001.00
    hostname: z1
    is-type: level-2-only
    segment-routing:
      srv6:
        locator: S
    interface:
    - if-name: lo
      ipv6:
        enabled: true
    - if-name: z1-z2
      network-type: point-to-point
      metric: 1
      ipv6:
        enabled: true
  bgp:
    global:
      as: 65501
      router-id: 10.0.0.1
    timer:
      adv-interval:
        ibgp: 1
    segment-routing:
      srv6:
        locator: S
    neighbor:
    - remote-address: 2001:db8::2
      remote-as: 65501
      update-source: 2001:db8::1
      enabled: true
      afi-safi:
      - name: mup
        enabled: true
    vrf:
    - name: ACC
      rd: "65501:10"
      encapsulation: srv6
      afi-safi:
        mup:
          segment:
          - type: interwork
            prefix: 10.0.0.0/24
    - name: ANC
      rd: "65501:30"
      encapsulation: srv6
      afi-safi:
        mup:
          segment:
          - type: direct
            mup-ext-comm: "1:2"
