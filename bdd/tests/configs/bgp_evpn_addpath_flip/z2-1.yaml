# Route reflector: z1 and z4 (the VTEPs) and z3 (the leaf) are clients;
# AddPath is negotiated toward z3 only.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    neighbor:
    - remote-address: 192.168.0.1
      afi-safi:
      - name: evpn
        enabled: true
      enabled: true
      remote-as: 65001
      route-reflector:
        client: true
    - remote-address: 192.168.0.4
      afi-safi:
      - name: evpn
        enabled: true
      enabled: true
      remote-as: 65001
      route-reflector:
        client: true
    - remote-address: 192.168.0.3
      afi-safi:
      - name: evpn
        enabled: true
        add-path: send-receive
      enabled: true
      remote-as: 65001
      route-reflector:
        client: true
