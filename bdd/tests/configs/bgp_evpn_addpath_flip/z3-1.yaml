# Leaf: receives every path-id the reflector holds for an EVPN key.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.3
    neighbor:
    - remote-address: 192.168.0.2
      afi-safi:
      - name: evpn
        enabled: true
        add-path: send-receive
      enabled: true
      remote-as: 65001
