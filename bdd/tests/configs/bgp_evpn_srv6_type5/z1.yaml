# z1 — EVPN Type-5 (RFC 9136 IP Prefix) over an SRv6 underlay, dual-stack.
# The EVPN-encoded twin of mirror_sid_vpnsrv6_base's z1: identical VRF,
# locator, IS-IS underlay and End.DT46 service SID, but the customer
# prefixes leave as EVPN Type-5 NLRI (AFI 25 / SAFI 70) instead of
# VPNv4 / VPNv6. `evpn advertise-ipv4` + `advertise-ipv6` under the VRF
# select that encoding; `encapsulation srv6` makes the carried service
# SID the per-VRF End.DT46 carved from LOC1 (dual-family, so one SID
# serves both AFIs). The neighbor negotiates ONLY the EVPN AFI/SAFI, so
# nothing here can forward via a VPNv4/VPNv6 path.
vrf:
- name: vrf-cust
  ipv4:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
  ipv6:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::1/128
- if-name: z1-z2
  ipv6:
    address: 2001:db8:0:12::1/64
- if-name: ce1
  vrf: vrf-cust
  ipv4:
    address: 10.1.1.1/24
  ipv6:
    address: 2001:db8:a::1/64
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
    behavior: usid
router:
  isis:
    net: 49.0000.0000.0000.0001.00
    hostname: z1
    is-type: level-2-only
    segment-routing:
      srv6:
        locator: LOC1
    interface:
    - if-name: lo
      ipv6:
        enabled: true
    - if-name: z1-z2
      network-type: point-to-point
      metric: 1
      ipv6:
        enabled: true
  bgp:
    global:
      as: 65001
      router-id: 10.0.0.1
    timer:
      adv-interval:
        ibgp: 1
    segment-routing:
      srv6:
        locator: LOC1
    neighbor:
    - remote-address: 2001:db8::2
      remote-as: 65001
      update-source: 2001:db8::1
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
    vrf:
    - name: vrf-cust
      rd: 65001:100
      encapsulation: srv6
      evpn:
        advertise-ipv4: true
        advertise-ipv6: true
      afi-safi:
        ipv4:
          network:
          - prefix: 10.1.1.0/24
        ipv6:
          network:
          - prefix: 2001:db8:a::/64
