# z2 (AS 65000): route reflector — z1 is a client; eBGP to z3.
router:
  bgp:
    global:
      as: 65000
      router-id: 10.0.69.2
    timer:
      adv-interval:
        ibgp: 1
        ebgp: 1
    neighbor:
    - remote-address: 10.0.69.1
      afi-safi:
      - name: sr-policy-v6
        enabled: true
      enabled: true
      remote-as: 65000
      route-reflector:
        client: true
    - remote-address: 10.0.69.3
      afi-safi:
      - name: sr-policy-v6
        enabled: true
      enabled: true
      remote-as: 65003
