# z1 (DUT, AS 65001): three eBGP paths for 2001:db8:54::/64 from scripted
# speakers — h1 and h3 in AS 65081 (MED 10 and 5), h2 in AS 65082 — and
# one downstream neighbor, z2, that shows which path z1 selected. IPv6
# unicast over IPv4 sessions; each path's next-hop is its global IPv6.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.55.1
    timer:
      adv-interval:
        ibgp: 1
        ebgp: 1
    neighbor:
    # The scripted speakers never listen on 179: passive keeps these peers
    # in Active so the scripts' connects are accepted.
    - remote-address: 192.168.55.2
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65081
      transport:
        passive-mode: true
    - remote-address: 192.168.55.3
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65082
      transport:
        passive-mode: true
    - remote-address: 192.168.55.4
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65081
      transport:
        passive-mode: true
    - remote-address: 192.168.55.5
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65090
