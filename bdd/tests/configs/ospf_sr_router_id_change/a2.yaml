# a2: the observer — OSPFv3 SR-MPLS, loopback Prefix-SID index 2 (label 16002).
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::2/128
- if-name: a2-a1
  ipv6:
    address: 2001:db8:12::2/64
router:
  ospfv3:
    router-id: 2.2.2.2
    segment-routing:
      mpls: {}
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
        prefix-sid:
          index: 2
      - if-name: a2-a1
        enabled: true
        network-type: point-to-point
