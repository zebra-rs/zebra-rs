# n2 — participates in algorithm 128 without advertising a definition;
# no measured links.
interface:
- if-name: lo
  ipv4:
    address: 10.0.0.3/32
- if-name: n2-ce
  ipv4:
    address: 192.168.70.6/30
- if-name: n2-n1
  ipv4:
    address: 192.168.70.9/30

router:
  isis:
    net: 49.0070.0000.0000.0003.00
    hostname: n2
    is-type: level-2-only
    segment-routing: mpls
    te-router-id: 10.0.0.3
    interface:
    - if-name: lo
      ipv4:
        enabled: true
        prefix-sid:
          index: 3
        flex-algo-prefix-sid:
        - algo: 128
          index: 13
    - if-name: n2-ce
      network-type: point-to-point
      ipv4:
        enabled: true
    - if-name: n2-n1
      network-type: point-to-point
      ipv4:
        enabled: true
    flex-algo:
    - algo: 128
      dataplane:
        sr-mpls: true
