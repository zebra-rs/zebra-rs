router:
  bgp:
    global:
      as: 65003
      router-id: 192.168.0.3
    timer:
      adv-interval:
        ibgp: 1
        ebgp: 1
    neighbor:
    - remote-address: 192.168.0.2
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      remote-as: 65000
      timers:
        connect-retry-time: 3
      otc-local-role:
      - role: route-server-client
    afi-safi:
    - name: ipv4
      network:
      - prefix: 10.0.0.3/32
