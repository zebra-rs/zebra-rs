router:
  bgp:
    global:
      as: 65000
      router-id: 192.168.0.2
    timer:
      adv-interval:
        ibgp: 1
        ebgp: 1
    neighbor:
    - remote-address: 192.168.0.1
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      remote-as: 65001
      timers:
        connect-retry-time: 3
      route-server-client: {}
    - remote-address: 192.168.0.3
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      remote-as: 65003
      timers:
        connect-retry-time: 3
      route-server-client: {}

