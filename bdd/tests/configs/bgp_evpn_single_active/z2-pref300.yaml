# z2 — the same segment with its preference raised to 300, above z1's 200.
# elected role on the per-EVI Ethernet A-D (rfc7432bis §7.11.1). Preference
# 100 under RFC 9785 Alg 2 pins the DF deterministically, so the P/B bits
# below are a property of the config rather than of a hash.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.2
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: host0
        role-signaling: l2-attr
        df-election:
          algorithm: preference
          preference: 300
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
