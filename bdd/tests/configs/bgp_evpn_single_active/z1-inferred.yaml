# z1 — the negative control: the SAME segment with `role-signaling` left at
# its default (`inferred`). Everything else, including the preference that
# makes z1 the Designated Forwarder, is unchanged — so an L2-Attr EC still
# appearing on its per-EVI A-D would mean the leaf is not load-bearing.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.1
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: host0
        df-election:
          algorithm: preference
          preference: 200
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
