interface:
- if-name: lo
  ipv4:
    address: 10.0.0.1/32
- if-name: i2
  ipv4:
    address: 10.0.12.1/30
router:
  isis:
    net: 49.0000.0000.0000.0001.00
    is-type: level-2-only
    hostname: a1
    interface:
    - if-name: lo
      circuit-type: level-2-only
      ipv4:
        enabled: true
    - if-name: i2
      circuit-type: level-2-only
      metric: 10
      hello:
        interval: 1
        multiplier: 5
      ipv4:
        enabled: true
