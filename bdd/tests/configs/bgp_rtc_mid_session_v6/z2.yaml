# z2 (PE, AS 65000): VRF blue imports RT 65000:100, so its rtcv6
# membership toward z1 is 65000:100.
vrf:
- name: blue
  ipv6:
    route-target:
      import:
      - 65000:100
router:
  bgp:
    global:
      as: 65000
      router-id: 192.168.68.2
    timer:
      adv-interval:
        ibgp: 1
        ebgp: 1
    neighbor:
    - remote-address: 2001:db8:68::1
      remote-as: 65000
      enabled: true
      afi-safi:
      - name: vpnv6
        enabled: true
      - name: rtcv6
        enabled: true
    vrf:
    - name: blue
      rd: 65000:2
