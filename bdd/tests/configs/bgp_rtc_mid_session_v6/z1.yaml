# z1 (PE, AS 65000): exports 2001:db8:29:1::/64 from VRF red with RT 65000:100 and
# 2001:db8:29:2::/64 from VRF green with RT 65000:200, and sends them to z2 over
# iBGP vpnv6, constrained by z2's rtcv6 membership (RFC 4684).
vrf:
- name: red
  ipv6:
    route-target:
      export:
      - 65000:100
- name: green
  ipv6:
    route-target:
      export:
      - 65000:200
router:
  bgp:
    global:
      as: 65000
      router-id: 192.168.68.1
    timer:
      adv-interval:
        ibgp: 1
        ebgp: 1
    neighbor:
    - remote-address: 2001:db8:68::2
      remote-as: 65000
      enabled: true
      afi-safi:
      - name: vpnv6
        enabled: true
      - name: rtcv6
        enabled: true
    vrf:
    - name: red
      rd: 65000:1
      afi-safi:
        ipv6:
          network:
          - prefix: 2001:db8:29:1::/64
    - name: green
      rd: 65000:3
      afi-safi:
        ipv6:
          network:
          - prefix: 2001:db8:29:2::/64
