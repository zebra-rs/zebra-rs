# z4 (AS 65100): z1's plain (non-AddPath) iBGP labeled-unicast neighbor.
router:
  bgp:
    global:
      as: 65100
      router-id: 192.168.52.4
    neighbor:
    - remote-address: 192.168.52.1
      afi-safi:
      - name: label-v4
        enabled: true
      - name: ipv4
        enabled: false
      enabled: true
      remote-as: 65100
