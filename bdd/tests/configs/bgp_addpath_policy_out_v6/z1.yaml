# z1 (DUT, AS 65001): learns two IPv6 prefixes from the scripted speaker h1
# and sends them to z2 with AddPath (IPv6 unicast over IPv4 sessions; the
# global IPv6 on the link is the next-hop). The out-policy toward z2
# denies 2001:db8:58:1::/64 and sets MED 50 on everything else.
prefix-set:
- name: DENY-P
  prefixes:
  - prefix: 2001:db8:58:1::/64
policy:
- name: OUT-Z2
  entry:
  - number: 10
    action: deny
    match:
      prefix-set: DENY-P
  - number: 20
    action: permit
    set:
      med:
        set: 50
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.59.1
    timer:
      adv-interval:
        ibgp: 1
        ebgp: 1
    neighbor:
    # The scripted speaker never listens on 179: passive keeps this peer
    # in Active so the script's connect is accepted.
    - remote-address: 192.168.59.2
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65061
      transport:
        passive-mode: true
    - remote-address: 192.168.59.3
      afi-safi:
      - name: ipv6
        enabled: true
        add-path: send-receive
        policy:
          out: OUT-Z2
      enabled: true
      remote-as: 65062
