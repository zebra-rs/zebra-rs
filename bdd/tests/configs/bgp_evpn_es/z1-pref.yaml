# z1 — Ethernet Segment es1 on RFC 9785 preference-based DF election (Alg 2)
# with NO preference value: the segment bids the RFC's mandatory default of
# 32767, which z2's Type-4 must be ranked against.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: all-active
        df-election:
          algorithm: preference
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
