# z2 — the same segment on Alg 2 with an explicit preference of 50000, above
# z1's defaulted 32767. z2 therefore wins the election despite having the
# HIGHER address, which neither service carving nor HRW would do for tag 0 —
# that is what makes the scenario discriminating.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: all-active
        df-election:
          algorithm: preference
          preference: 50000
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
