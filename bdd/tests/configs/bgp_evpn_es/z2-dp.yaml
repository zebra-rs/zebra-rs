# z2 — Alg 2 with NO preference value, so both PEs bid the RFC 9785 default of
# 32767, plus the "Don't Preempt" (DP) capability. The preferences tie, so the
# DP bit decides: z2 wins even though 192.168.0.1 is the lower address, which
# is the only thing separating this scenario from the plain tie.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: all-active
        df-election:
          algorithm: preference
          dont-preempt: null
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
