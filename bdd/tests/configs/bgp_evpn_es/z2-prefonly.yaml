# z2 — Alg 2 with no preference value and no DP bit: both PEs bid the RFC 9785
# default of 32767 and the tie falls to the lowest address (z1). The negative
# control for the DP scenario — the ONLY difference from z2-dp.yaml is the
# `dont-preempt` leaf.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: all-active
        df-election:
          algorithm: preference
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
