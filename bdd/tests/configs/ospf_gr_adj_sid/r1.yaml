# r1: OSPFv2 and OSPFv3 side by side over one dual-stack link, both
# SR-MPLS. Loopback Prefix-SIDs: OSPFv2 index 11 (label 16011),
# OSPFv3 index 1 (label 16001).
interface:
- if-name: lo
  ipv4:
    address: 192.168.1.1/32
  ipv6:
    address: 2001:db8::1/128
- if-name: r1-r2
  ipv4:
    address: 10.0.12.1/30
  ipv6:
    address: 2001:db8:12::1/64
router:
  ospf:
    router-id: 1.1.1.1
    segment-routing:
      mpls: {}
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
        prefix-sid:
          index: 11
      - if-name: r1-r2
        enabled: true
        network-type: point-to-point
  ospfv3:
    router-id: 1.1.1.1
    segment-routing:
      mpls: {}
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
        prefix-sid:
          index: 1
      - if-name: r1-r2
        enabled: true
        network-type: point-to-point
