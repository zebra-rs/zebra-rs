# z1 with `update-source lo` on a neighbor-group, and nothing on the
# neighbors: one statement for an IPv4 and an IPv6 member. `lo` has an
# address of each family; each member is sourced from the one of its
# own.
interface:
- if-name: lo
  ipv4:
    address: 10.255.0.3/32
  ipv6:
    address: 2001:db8:255::1/128
- if-name: vz1ns
  ipv6:
    address: 2001:db8::1/64
router:
  static:
    ipv4:
      route:
      - prefix: 10.255.0.2/32
        nexthop:
        - address: 10.0.0.2
    ipv6:
      route:
      - prefix: 2001:db8:255::2/128
        nexthop:
        - address: 2001:db8::2
  bgp:
    global:
      as: 65001
      router-id: 10.255.0.1
    timer:
      adv-interval:
        ibgp: 1
        ebgp: 1
    neighbor-group:
    - name: LOOP
      remote-as: 65001
      update-source: lo
    neighbor:
    - remote-address: 10.255.0.2
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      neighbor-group: LOOP
    - remote-address: 2001:db8:255::2
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      neighbor-group: LOOP
    afi-safi:
    - name: ipv4
      network:
      - prefix: 10.1.1.1/32
    - name: ipv6
      network:
      - prefix: 2001:db8:1::/64
