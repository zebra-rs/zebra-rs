# z1 — the same BGP and VRF over a 100-label dynamic range: too small for
# a 128-label chunk, so the VRF spawns without a label.
vrf:
- name: vrf-a
  ipv4:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
mpls:
  label-range:
    dynamic:
      start: 30000
      end: 30099
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    neighbor:
    - remote-address: 192.168.0.2
      remote-as: 65001
      enabled: true
      afi-safi:
      - name: vpnv4
        enabled: true
    vrf:
    - name: vrf-a
      rd: 65001:1
