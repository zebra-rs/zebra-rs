# z1 — BGP with one VRF (and a vpnv4 neighbor that never comes up): the
# VRF takes its MPLS label at once, from a 128-label chunk BGP takes from
# the default dynamic range (24000-1048574).
vrf:
- name: vrf-a
  ipv4:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    neighbor:
    - remote-address: 192.168.0.2
      remote-as: 65001
      enabled: true
      afi-safi:
      - name: vpnv4
        enabled: true
    vrf:
    - name: vrf-a
      rd: 65001:1
