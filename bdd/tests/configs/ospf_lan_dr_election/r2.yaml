# r2 — the middle Router ID: BDR, and DR once r3 has gone.
# OSPFv2 and OSPFv3 both run over the one broadcast network, at the
# default priority.
interface:
- if-name: lo
  ipv4:
    address: 10.0.0.2/32
  ipv6:
    address: 2001:db8::2/128
- if-name: r2-sw
  ipv4:
    address: 192.168.10.2/24
  ipv6:
    address: 2001:db8:10::2/64
router:
  ospf:
    router-id: 10.0.0.2
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
      - if-name: r2-sw
        enabled: true
        network-type: broadcast
  ospfv3:
    router-id: 10.0.0.2
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
      - if-name: r2-sw
        enabled: true
        network-type: broadcast
