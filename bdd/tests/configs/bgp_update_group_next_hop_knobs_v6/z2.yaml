# z2 — plain iBGP neighbor of z1. Session only; z2-network.yaml adds its
# prefix once every session is Established.
router:
  bgp:
    global:
      as: 65001
      router-id: 10.61.0.2
    neighbor:
    - remote-address: 2001:db8:60::1
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65001
