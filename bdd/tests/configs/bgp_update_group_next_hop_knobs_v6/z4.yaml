# z4 — eBGP neighbor (AS 65002) toward which z1 has `next-hop-unchanged`.
# Session only; z4-network.yaml adds its prefix once every session is
# Established.
router:
  bgp:
    global:
      as: 65002
      router-id: 10.61.0.4
    neighbor:
    - remote-address: 2001:db8:60::1
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65001
