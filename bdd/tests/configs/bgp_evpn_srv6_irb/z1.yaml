# z1 — one PE running BOTH EVPN-over-SRv6 services at once, the
# control-plane shape of symmetric IRB:
#   L2 — `advertise-all-vni` + `encapsulation srv6` bridges VNI 10, so a
#        local MAC leaves as a Type-2 carrying a per-VNI End.DT2U and the
#        IMET carries an End.DT2M.
#   L3 — vrf-cust (`encapsulation srv6` + `evpn advertise-ipv4/ipv6`)
#        routes between subnets, so its prefixes leave as Type-5 carrying
#        the per-VRF End.DT46.
# All three SIDs are carved from the SAME locator LOC1 and the same SID
# pool, which is the point of the test: the L2 and L3 allocators must
# coexist without colliding or evicting each other.
vrf:
- name: vrf-cust
  ipv4:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
  ipv6:
    route-target:
      import:
      - 65001:100
      export:
      - 65001:100
interface:
- if-name: lo
  ipv6:
    address: 2001:db8::1/128
- if-name: z1z2
  ipv6:
    address: 2001:db8:0:12::1/64
- if-name: ce1
  vrf: vrf-cust
  ipv4:
    address: 10.1.1.1/24
  ipv6:
    address: 2001:db8:a::1/64
segment-routing:
  locator:
  - name: LOC1
    prefix: fcbb:bbbb:1::/48
    behavior: usid
vxlan:
- name: vxlan10
  vni: 10
  local-address: 2001:db8::1
router:
  isis:
    net: 49.0000.0000.0000.0001.00
    hostname: z1
    is-type: level-2-only
    segment-routing:
      srv6:
        locator: LOC1
    interface:
    - if-name: lo
      ipv6:
        enabled: true
    - if-name: z1z2
      network-type: point-to-point
      metric: 1
      ipv6:
        enabled: true
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    timer:
      adv-interval:
        ibgp: 1
    segment-routing:
      srv6:
        locator: LOC1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      encapsulation: srv6
    neighbor:
    - remote-address: 2001:db8::2
      remote-as: 65001
      update-source: 2001:db8::1
      enabled: true
      afi-safi:
      - name: evpn
        enabled: true
    vrf:
    - name: vrf-cust
      rd: 65001:100
      encapsulation: srv6
      evpn:
        advertise-ipv4: true
        advertise-ipv6: true
      afi-safi:
        ipv4:
          network:
          - prefix: 10.1.1.0/24
        ipv6:
          network:
          - prefix: 2001:db8:a::/64
