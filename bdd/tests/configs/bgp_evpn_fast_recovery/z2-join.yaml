# z2 — joining the segment with the better preference (300), so the election
# moves the role to it. With fast recovery it announces WHEN it will carve,
# and z1 holds its role until that instant instead of dropping it the moment
# this Type-4 arrives.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.2
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: host0
        df-election:
          algorithm: preference
          preference: 300
          fast-recovery:
            peering-time: 20
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
