# z2 — the negative control: the same join, same preference, but WITHOUT
# fast-recovery. The capability is then not unanimous on the segment, so
# nobody may hold a role for an announced instant (RFC 9722 Section 2.3) and
# z1 moves the moment this arrives.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.2
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: host0
        df-election:
          algorithm: preference
          preference: 300
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
