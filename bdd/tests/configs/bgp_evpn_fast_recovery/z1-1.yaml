# z1 — the incumbent. Preference 100, and RFC 9722 fast recovery with a
# 20 s peering time: long enough that the window in which it holds its
# Designated Forwarder role is observable rather than a race.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.1
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: host0
        df-election:
          algorithm: preference
          preference: 100
          fast-recovery:
            peering-time: 20
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
