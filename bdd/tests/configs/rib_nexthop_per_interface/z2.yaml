# z2: fe80::1 toward z1 (set by the feature), z4 behind.
# OSPFv2 and OSPFv3, SR-MPLS on v3: loopback Prefix-SID index 2 (label 16002).
interface:
- if-name: lo
  ipv4:
    address: 10.0.0.2/32
  ipv6:
    address: 2001:db8::2/128
- if-name: z2-z1
  ipv4:
    address: 10.0.12.2/30
- if-name: z2-z4
  ipv4:
    address: 10.0.24.1/30
  ipv6:
    address: 2001:db8:24::1/64
router:
  ospf:
    router-id: 10.0.0.2
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
      - if-name: z2-z1
        enabled: true
        network-type: point-to-point
      - if-name: z2-z4
        enabled: true
        network-type: point-to-point
  ospfv3:
    router-id: 10.0.0.2
    segment-routing:
      mpls: {}
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
        prefix-sid:
          index: 2
      - if-name: z2-z1
        enabled: true
        network-type: point-to-point
      - if-name: z2-z4
        enabled: true
        network-type: point-to-point
