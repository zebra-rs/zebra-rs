# z4 — eBGP originator (AS 65002); each variant adds one more prefix so a
# fresh best-path event runs through z1's update-group memo.
router:
  bgp:
    global:
      as: 65002
      router-id: 10.70.0.4
    neighbor:
    - remote-address: 192.168.70.1
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      remote-as: 65001
    afi-safi:
    - name: ipv4
      network:
      - prefix: 10.40.1.0/24
      - prefix: 10.40.2.0/24
      - prefix: 10.40.3.0/24
