# z4 — eBGP neighbor (AS 65002) originating 2001:db8:85::/64.
router:
  bgp:
    global:
      as: 65002
      router-id: 10.81.0.4
    neighbor:
    - remote-address: 2001:db8:80::1
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65001
    afi-safi:
    - name: ipv6
      network:
      - prefix: 2001:db8:85::/64
