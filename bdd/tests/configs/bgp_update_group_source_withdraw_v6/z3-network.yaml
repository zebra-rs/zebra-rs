# z3 — same session, now originating 2001:db8:85::/64 itself: an empty AS_PATH
# beats z4's one-hop path at the reflector, so z1's best flips to z3.
router:
  bgp:
    global:
      as: 65001
      router-id: 10.81.0.3
    neighbor:
    - remote-address: 2001:db8:80::1
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65001
    afi-safi:
    - name: ipv6
      network:
      - prefix: 2001:db8:85::/64
