# z3 — the remote ingress PE: no Ethernet Segment, no access port. It receives
# z1's per-EVI A-D (with the role) and z1's Type-2 for the CE MAC, and has to
# decide where that MAC lives.
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.3
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.3
    afi-safi:
    - name: evpn
      advertise-all-vni: true
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.5
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
