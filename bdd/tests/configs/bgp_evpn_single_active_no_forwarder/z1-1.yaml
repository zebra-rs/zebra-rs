# z1 — the only PE on segment es1 with an access port in bridge domain 10, so
# it is the only PE that originates a per-EVI Ethernet A-D for it and the only
# member of the remote's nexthop group. Its own preference (100) is deliberately
# modest: z2 and z4 are on the same segment with no port at all, so they take
# part in the DF election without ever joining the group — which is how this
# topology reaches "every group member says it is NOT the forwarder".
vxlan:
- name: vxlan10
  vni: 10
  local-address: 192.168.0.1
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      advertise-all-vni: true
      ethernet-segment:
      - name: es1
        esi: "00:11:22:33:44:55:66:77:88:99"
        redundancy-mode: single-active
        interface: host0
        role-signaling: l2-attr
        df-election:
          algorithm: preference
          preference: 100
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.3
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.4
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
    - remote-address: 192.168.0.5
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: evpn
        enabled: true
