# z3 — the session stays up, 2001:db8:70::/48 is no longer originated.
router:
  bgp:
    global:
      as: 65003
      router-id: 10.0.0.3
    timer:
      adv-interval:
        ebgp: 1
    neighbor:
    - remote-address: 2001:db8::2
      timers: {connect-retry-time: 3}
      remote-as: 65002
      enabled: true
      afi-safi:
      - name: ipv6
        enabled: true
