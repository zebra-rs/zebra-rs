# z2 — as z2.yaml, plus a static route for 2001:db8:70::/48 (distance 1),
# which outranks the BGP route at the same kernel priority (metric 0,
# which IPv6 reports as 1024).
router:
  static:
    ipv6:
      route:
      - prefix: 2001:db8:70::/48
        nexthop:
        - address: 2001:db8::9
  bgp:
    global:
      as: 65002
      router-id: 10.0.0.2
    timer:
      adv-interval:
        ebgp: 1
    neighbor:
    - remote-address: 2001:db8::1
      timers: {connect-retry-time: 3}
      remote-as: 65001
      enabled: true
      afi-safi:
      - name: ipv6
        enabled: true
    - remote-address: 2001:db8::3
      timers: {connect-retry-time: 3}
      remote-as: 65003
      enabled: true
      afi-safi:
      - name: ipv6
        enabled: true
