# z2 variant: flipped to the DEFAULT `encapsulation vxlan` (the leaf
# removed) while z1 stays MPLS — the mixed-encapsulation migration step.
# z2's Type-1 now carries VNI 100 (= the EVI) with the VXLAN EC; z2
# keeps binding z1's PE+label, z1 binds z2's VTEP+VNI.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 102
        remote-service-id: 101
        interface: ce2
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
