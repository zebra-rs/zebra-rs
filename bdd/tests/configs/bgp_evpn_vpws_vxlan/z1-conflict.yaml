# z1 variant: a second service (eline9, its own EVI and AC) configured
# with the SAME VNI eline1 is already advertising (10101). A VNI is a
# per-PE decap identity — eline9 must park in vni-conflict, not
# originate, and eline1 must be untouched.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 102
        interface: ce1
        vni: 10101
      - name: eline9
        evi: 300
        local-service-id: 301
        remote-service-id: 302
        interface: ce9
        vni: 10101
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
