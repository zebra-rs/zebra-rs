# z2 — the other VPWS/VXLAN PE. Same E-Line (eline1, EVI 100), Ethernet
# Tag 102, importing z1's Type-1 (Ethernet Tag 101). No `vni` leaf: the
# advertised VNI defaults to the EVI (100), proving both spellings.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    afi-safi:
    - name: evpn
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 102
        remote-service-id: 101
        interface: ce2
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
