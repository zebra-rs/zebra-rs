# z1 variant: eline1 re-pointed at remote-service-id 999, which nobody
# advertises — the reconcile must drop the bound remote VTEP+VNI and fall
# back to `advertised`.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 999
        interface: ce1
        vni: 10100
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
