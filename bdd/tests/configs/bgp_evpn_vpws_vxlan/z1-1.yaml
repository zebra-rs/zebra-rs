# z1 — EVPN VPWS PE over VXLAN (RFC 8365 §6). One E-Line service (eline1,
# EVI 100) under the DEFAULT `encapsulation vxlan` (deliberately not
# spelled): the per-EVI Ethernet A-D (Type-1, Ethernet Tag 101) carries the
# explicit service VNI 10100 in its label field plus the VXLAN
# Encapsulation extended community, next hop = the router-id. No SRv6
# locator anywhere — VXLAN VPWS needs none.
# Control-plane only — no cradle dataplane; the AC name is not resolved here.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 102
        interface: ce1
        vni: 10100
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
