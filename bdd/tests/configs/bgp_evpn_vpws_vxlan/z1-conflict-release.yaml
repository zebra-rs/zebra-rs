# z1 variant: eline1 moves off the contested VNI (10101 → 10100),
# releasing it. eline9 is UNCHANGED — the vni-conflict retry hook alone
# must re-originate it.
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.1
    afi-safi:
    - name: evpn
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 101
        remote-service-id: 102
        interface: ce1
        vni: 10100
      - name: eline9
        evi: 300
        local-service-id: 301
        remote-service-id: 302
        interface: ce9
        vni: 10101
    neighbor:
    - remote-address: 192.168.0.2
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
