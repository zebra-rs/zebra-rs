# z2 variant: flipped to `encapsulation srv6` mid-life (gaining LOC2) while
# z1 stays VXLAN — the mixed-encapsulation migration step. z2's Type-1 now
# carries an End.DX2 SID carved from LOC2; z2 keeps binding z1's VTEP+VNI,
# z1 binds z2's SID. Each direction is what its originator signalled.
segment-routing:
  locator:
  - name: LOC2
    prefix: fcbb:bbbb:2::/48
    behavior: usid
router:
  bgp:
    global:
      as: 65001
      router-id: 192.168.0.2
    segment-routing:
      srv6:
        locator: LOC2
    afi-safi:
    - name: evpn
      encapsulation: srv6
      vpws:
      - name: eline1
        evi: 100
        local-service-id: 102
        remote-service-id: 101
        interface: ce2
    neighbor:
    - remote-address: 192.168.0.1
      enabled: true
      remote-as: 65001
      afi-safi:
      - name: ipv4
        enabled: true
      - name: evpn
        enabled: true
