# z1 (DUT, AS 65001): learns 2001:db8:64:1::/64 from the scripted speaker h1
# with the third-party next-hop 2001:db8:64:99::2, which resolves through the
# static route below; sends it to z2 with AddPath and to z3 without
# (IPv6 unicast over IPv4 sessions; deleting the static route makes the
# next-hop unreachable).
router:
  static:
    ipv6:
      route:
      - prefix: 2001:db8:64:99::/64
        nexthop:
        - address: 2001:db8:65::2
  bgp:
    global:
      as: 65001
      router-id: 192.168.65.1
    timer:
      adv-interval:
        ibgp: 1
        ebgp: 1
    neighbor:
    # The scripted speaker never listens on 179: passive keeps this peer
    # in Active so the script's connect is accepted.
    - remote-address: 192.168.65.2
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65091
      transport:
        passive-mode: true
    - remote-address: 192.168.65.3
      afi-safi:
      - name: ipv6
        enabled: true
        add-path: send-receive
      enabled: true
      remote-as: 65092
    - remote-address: 192.168.65.4
      afi-safi:
      - name: ipv6
        enabled: true
      enabled: true
      remote-as: 65093
