interface:
- if-name: lo
  ipv6:
    address: 2001:db8:0:ff61::2/128
- if-name: st2-st1
  ipv6:
    address: 2001:db8:61::2/64

router:
  isis:
    net: 49.0061.0000.0000.0002.00
    hostname: st2
    is-type: level-2-only
    interface:
    - if-name: lo
      ipv6:
        enabled: true
    - if-name: st2-st1
      network-type: point-to-point
      ipv6:
        enabled: true
      te-metric:
        measurement:
          enabled: true
          interval: 100
          damping-period: 2
  ospfv3:
    router-id: 10.61.0.2
    segment-routing:
      mpls: {}
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
      - if-name: st2-st1
        enabled: true
        network-type: point-to-point
        te-metric:
          measurement:
            enabled: true
            interval: 100
            damping-period: 2
