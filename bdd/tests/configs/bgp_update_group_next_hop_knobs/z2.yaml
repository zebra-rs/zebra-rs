# z2 — iBGP neighbor toward which z1 has `next-hop-self`. Session only;
# z2-network.yaml adds its prefix once every session is Established.
router:
  bgp:
    global:
      as: 65001
      router-id: 10.60.0.2
    neighbor:
    - remote-address: 192.168.60.1
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      remote-as: 65001
