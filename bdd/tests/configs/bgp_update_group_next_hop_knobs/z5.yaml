# z5 — eBGP neighbor (AS 65003) toward which z1 has `next-hop-unchanged`;
# listener.
router:
  bgp:
    global:
      as: 65003
      router-id: 10.60.0.5
    neighbor:
    - remote-address: 192.168.60.1
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      remote-as: 65001
