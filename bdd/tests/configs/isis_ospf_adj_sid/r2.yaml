# r2: IS-IS, OSPFv2 and OSPFv3 side by side over one dual-stack link,
# all three SR-MPLS. Loopback Prefix-SIDs: IS-IS index 22 (label 16022),
# OSPFv2 index 12 (label 16012), OSPFv3 index 2 (label 16002).
interface:
- if-name: lo
  ipv4:
    address: 192.168.1.2/32
  ipv6:
    address: 2001:db8::2/128
- if-name: r2-r1
  ipv4:
    address: 10.0.12.2/30
  ipv6:
    address: 2001:db8:12::2/64
router:
  isis:
    net: 49.0000.0000.0000.0002.00
    hostname: r2
    is-type: level-2-only
    segment-routing:
      mpls: {}
    interface:
    - if-name: lo
      ipv4:
        enabled: true
        prefix-sid:
          index: 22
    - if-name: r2-r1
      circuit-type: level-2-only
      network-type: point-to-point
      ipv4:
        enabled: true
  ospf:
    router-id: 2.2.2.2
    segment-routing:
      mpls: {}
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
        prefix-sid:
          index: 12
      - if-name: r2-r1
        enabled: true
        network-type: point-to-point
  ospfv3:
    router-id: 2.2.2.2
    segment-routing:
      mpls: {}
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
        prefix-sid:
          index: 2
      - if-name: r2-r1
        enabled: true
        network-type: point-to-point
