# r4 — participates in algorithm 128 without advertising a definition.
affinity-map:
  affinity:
  - name: blue
    bit-position: 0
  - name: red
    bit-position: 1

interface:
- if-name: lo
  ipv4:
    address: 10.0.0.4/32
- if-name: r4-r3
  ipv4:
    address: 192.168.90.10/30
- if-name: r4-r1
  ipv4:
    address: 192.168.90.13/30

router:
  ospf:
    router-id: 10.0.0.4
    segment-routing:
      mpls: {}
    area:
    - area-id: 0.0.0.0
      interface:
      - if-name: lo
        enabled: true
        prefix-sid:
          index: 4
        flex-algo-prefix-sid:
        - algo: 128
          index: 1284
      - if-name: r4-r3
        enabled: true
        network-type: point-to-point
        cost: 10
      - if-name: r4-r1
        enabled: true
        network-type: point-to-point
        cost: 10
    flex-algo:
    - algo: 128
      dataplane:
        sr-mpls: true
