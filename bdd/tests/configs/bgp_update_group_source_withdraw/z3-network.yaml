# z3 — same session, now originating 10.80.5.0/24 itself: an empty AS_PATH
# beats z4's one-hop path at the reflector, so z1's best flips to z3.
router:
  bgp:
    global:
      as: 65001
      router-id: 10.80.0.3
    neighbor:
    - remote-address: 192.168.80.1
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      remote-as: 65001
    afi-safi:
    - name: ipv4
      network:
      - prefix: 10.80.5.0/24
