# z3 — route-reflector client (AS 65001), the higher-index client; z3-network.yaml makes it originate the prefix.
router:
  bgp:
    global:
      as: 65001
      router-id: 10.80.0.3
    neighbor:
    - remote-address: 192.168.80.1
      afi-safi:
      - name: ipv4
        enabled: true
      enabled: true
      remote-as: 65001
